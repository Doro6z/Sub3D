<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep: #020408; --bg-surface: #0a0e16; --bg-glass: rgba(15, 23, 42, 0.7);
    --border: rgba(51, 65, 85, 0.4); --border-bright: rgba(56, 189, 248, 0.3);
    --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-dim: #475569;
    --cyan: #06b6d4; --cyan-bright: #22d3ee; --ruby: #ef4444; --emerald: #10b981; --amber: #f59e0b;
    --sidebar-w: 280px; --panel-w: 480px; --topbar-h: 60px;
  }
  html, body { height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; background: var(--bg-deep); color: var(--text-primary); }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .glass { background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border); }
  
  .btn {
    font-size: 10px; font-weight: 800; padding: 10px 18px; border: 1px solid var(--border);
    background: rgba(30, 41, 59, 0.5); color: var(--text-secondary); cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.15em; border-radius: 4px; transition: all 0.2s;
  }
  .btn:hover { border-color: var(--cyan); color: var(--text-primary); background: rgba(56, 189, 248, 0.1); }
  .btn.primary { background: var(--cyan); color: #000; border-color: var(--cyan); }
  .btn.danger { color: var(--ruby); border-color: rgba(239, 68, 68, 0.3); }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
    background: var(--bg-surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; z-index: 1000;
  }
  .logo { font-size: 16px; font-weight: 900; color: var(--cyan); letter-spacing: 0.3em; text-transform: uppercase; margin-right: 40px; }
  #app-root { position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: 0; display: flex; }

  #sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-surface); border-right: 1px solid var(--border); overflow-y: auto; }
  .sb-header { padding: 16px 20px 8px; font-size: 10px; font-weight: 900; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.2em; display: flex; align-items: center; justify-content: space-between; }
  .sb-item { padding: 8px 20px 8px 36px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .sb-item.selected { background: rgba(56, 189, 248, 0.08); color: var(--cyan-bright); font-weight: 700; border-left: 3px solid var(--cyan); }
  .sb-dot { width: 6px; height: 6px; border-radius: 50%; }

  #viewport { position: relative; flex: 1; background: var(--bg-deep); overflow: hidden; }
  #cy { 
    width: 100%; height: 100%; outline: none;
    background-image: radial-gradient(circle, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  #panel { width: var(--panel-w); flex-shrink: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .panel-hdr { padding: 40px 30px 30px; }
  .panel-tabs { display: flex; background: #000; padding: 4px; margin: 0 30px; border-radius: 6px; }
  .tab-btn { flex: 1; border: none; background: transparent; padding: 12px; font-size: 10px; font-weight: 800; color: var(--text-dim); cursor: pointer; text-transform: uppercase; }
  .tab-btn.active { background: var(--cyan); color: #000; border-radius: 4px; }
  .panel-content { flex: 1; overflow-y: auto; padding: 30px; }

  /* EXCEL VIEW */
  #excel-view { position: absolute; inset: 0; background: var(--bg-deep); z-index: 500; display: none; overflow-y: auto; padding: 60px; }
  .spreadsheet { width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid var(--border); }
  .spreadsheet th { background: #000; color: var(--text-dim); padding: 14px; border: 1px solid var(--border); text-transform: uppercase; font-size: 9px; }
  .spreadsheet input { width: 100%; height: 40px; border: none; background: transparent; color: var(--text-primary); padding: 0 14px; outline: none; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div id="topbar">

  <div style="display:flex; gap: 12px;">

  </div>

<div id="app-root">

</div>
<div id="modal-mask"><div id="modal" style="background:var(--bg-surface); padding:40px; border:1px solid var(--cyan)"></div></div>

let SCHEMA = JSON.parse(JSON.stringify(RAW_SCHEMA));

let cy, activeTab = 'schema', selectedId = null, currentView = 'graph';
const STORAGE_KEY = 'sub3d_studio_ultimate_v2';
let positions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

window.onload = () => { renderSidebar(); initGraph(); renderGlobalManager(); };

function initGraph() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: buildElements(),
    wheelSensitivity: 0.1, minZoom: 0.05, maxZoom: 4,
    style: [
      { selector: 'node', style: { 
        'background-color': 'data(color)', 'background-opacity': 0.1, 'border-color': 'data(color)', 'border-width': 2,
        'label': 'data(label)', 'color': '#fff', 'font-size': '12px', 'font-family': 'Inter, sans-serif', 'font-weight': 'bold',
        'text-valign': 'center', 'text-halign': 'center', 'width': '280px', 'height': '80px',
        'shape': 'roundrectangle', 'text-wrap': 'wrap', 'text-max-width': '240px', 'text-justification': 'center'
      } },
      { selector: 'node[?isParent]', style: { 'background-opacity': 0.03, 'border-width': 1.5, 'border-color': 'data(color)', 'label': 'data(label)', 'text-valign': 'top', 'padding': 80, 'text-margin-y': -25, 'font-weight': '900', 'color': 'data(color)', 'font-size': '15px' } },
      { selector: 'node:selected, node.highlighted', style: { 'background-opacity': 0.35, 'border-width': 5, 'z-index': 100 } },
      { selector: 'edge', style: { 'width': 2, 'line-color': '#1e293b', 'target-arrow-shape': 'triangle', 'target-arrow-color': '#1e293b', 'curve-style': 'bezier', 'label': 'data(label)', 'font-size': '10px', 'color': '#94a3b8', 'text-background-opacity': 1, 'text-background-color': '#020408' } }
    ]
  });

  cy.nodes().forEach(n => { if (positions[n.id()]) n.position(positions[n.id()]); });
  
  // MMB PAN
  let mmb = false, last = null;
  cy.on('mousedown', e => { if (e.originalEvent.button === 1) { mmb=true; last={x:e.clientX, y:e.clientY}; } });
  window.addEventListener('mousemove', e => { if(mmb && last){ cy.panBy({ x: e.clientX-last.x, y: e.clientY-last.y }); last={x:e.clientX, y:e.clientY}; } });
  window.addEventListener('mouseup', e => { if(e.button===1) mmb=false; });

  cy.on('tap', 'node', e => { if(e.target.data('isParent')) selectDomain(parseInt(e.target.id().replace('domain_',''))); else select(e.target.id()); });
  cy.on('tap', e => { if(e.target === cy) renderGlobalManager(); });

  // FORCE RE-RENDER FOR FONTS
  setTimeout(() => { cy.style().update(); }, 500); 
}

function buildElements() {
  const els = [];
  SCHEMA.domains.forEach(d => els.push({ data: { id: `domain_${d.id}`, label: d.name.toUpperCase(), color: d.color, isParent: true } }));
  SCHEMA.tables.forEach(t => { const d = SCHEMA.domains.find(x => x.id === t.domain); els.push({ data: { id: t.id, label: t.id.replace(/_/g, ' '), parent: `domain_${t.domain}`, color: d?.color || '#333' } }); });
  SCHEMA.tables.forEach(t => (t.relations || []).forEach(r => els.push({ data: { id: `${t.id}_${r.target}`, source: t.id, target: r.target, label: r.type } })));
  return els;
}

function select(id) {
  selectedId = id; const t = SCHEMA.tables.find(x => x.id === id); const d = SCHEMA.domains.find(x => x.id === t.domain);
  document.getElementById('panel-hdr-area').innerHTML = `<div class="panel-hdr"><div style="font-size:10px; font-weight:900; color:${d.color}">${d.name.toUpperCase()}</div><div style="font-size:28px; font-weight:900; margin-top:8px">${t.id}</div><div style="margin-top:20px; display:flex; gap:10px"><button class="btn" onclick="renameTable('${t.id}')">Rename</button><button class="btn danger" onclick="deleteTable('${t.id}')">Delete</button></div></div>`;
  document.getElementById('panel-tabs-area').style.display = 'flex'; setPanelTab(activeTab); renderSidebar();
  cy.nodes().removeClass('highlighted'); cy.getElementById(id).addClass('highlighted');
}

function setPanelTab(tab) {
  activeTab = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(tab.toLowerCase())));
  const t = SCHEMA.tables.find(x => x.id === selectedId); let html = '';
  if (tab === 'schema') {
    html = `<div style="font-size:11px; font-weight:900; color:var(--cyan); margin-bottom:20px">COLUMNS <button class="btn" style="padding:4px 8px" onclick="addCol()">+ ADD</button></div>`;
    t.columns.forEach(c => html += `<div style="padding:15px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:4px; margin-bottom:10px; display:flex; justify-content:space-between"><span><b>${c.name}</b> <small style="opacity:0.5">${c.type}</small></span><button class="btn" style="padding:0 8px" onclick="delCol('${c.name}')">×</button></div>`);
  } else if (tab === 'links') {
    html = `<div style="font-size:11px; font-weight:900; color:var(--cyan); margin-bottom:20px">RELATIONS <button class="btn" style="padding:4px 8px" onclick="openRelModal()">+ NEW</button></div>`;
    t.relations.forEach((r,i) => html += `<div class="glass" style="padding:15px; margin-bottom:10px; cursor:pointer" onclick="select('${r.target}')"><b>${r.target}</b> <small style="display:block; color:var(--cyan)">${r.type}</small></div>`);
  } else if (tab === 'data') {
    html = `<div style="font-size:11px; font-weight:900; color:var(--cyan); margin-bottom:20px">RAW DATA <button class="btn" onclick="addRow('${t.id}')">+ ROW</button></div>`;
    html += `<div style="overflow-x:auto"><table class="spreadsheet"><tr>${t.columns.map(c => `<th>${c.name}</th>`).join('')}</tr>`;
    (t.rows || []).forEach((row, idx) => { html += `<tr>${t.columns.map(c => `<td><input value="${row[c.name]||''}" onchange="updRow('${t.id}',${idx},'${c.name}',this.value)"></td>`).join('')}</tr>`; });
    html += '</table></div>';
  }
  document.getElementById('panel-content-area').innerHTML = html;
}

function renderGlobalManager() {
  selectedId = null; document.getElementById('panel-hdr-area').innerHTML = `<div class="panel-hdr"><div style="font-size:10px; font-weight:900; color:var(--cyan)">NETWORK TOPOLOGY</div><div style="font-size:28px; font-weight:900">SCHEMA COMMAND</div></div>`;
  document.getElementById('panel-tabs-area').style.display = 'none';
  let h = `<div style="font-size:11px; font-weight:900; color:var(--cyan); border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:20px">DOMAINS</div>`;
  SCHEMA.domains.forEach(d => h += `<div onclick="selectDomain(${d.id})" style="padding:15px; background:var(--bg-surface); border:1px solid var(--border); border-radius:4px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer"><div style="width:10px; height:10px; background:${d.color}; border-radius:50%"></div><b>${d.name}</b></div>`);
  document.getElementById('panel-content-area').innerHTML = h;
}

function selectDomain(id) {
  const d = SCHEMA.domains.find(x => x.id === id);
  document.getElementById('panel-hdr-area').innerHTML = `<div class="panel-hdr"><div style="font-size:10px; font-weight:900; color:${d.color}">CLUSTER</div><div style="font-size:28px; font-weight:900; color:${d.color}">${d.name.toUpperCase()}</div></div>`;
  document.getElementById('panel-content-area').innerHTML = `<div style="margin-bottom:20px"><label>NAME</label><input value="${d.name}" onchange="updateDomInfo(${id}, 'name', this.value)" style="width:100%; padding:14px; background:#000; border:1px solid var(--border); color:#fff"></div><button class="btn primary" style="width:100%" onclick="openNewTableModal(${id})">+ NEW TABLE IN CLUSTER</button>`;
}

function renameTable(tid) { 
  const n = prompt("New Tables ID:", tid); 
  if(n && n !== tid) {
    SCHEMA.tables.find(x=>x.id===tid).id = n;
    SCHEMA.tables.forEach(t => (t.relations||[]).forEach(r => { if(r.target === tid) r.target = n; }));
    if(positions[tid]) { positions[n] = positions[tid]; delete positions[tid]; }
    refresh(); select(n);
  }
}
function deleteTable(tid) { if(confirm(`DELETE ${tid}?`)) { SCHEMA.tables = SCHEMA.tables.filter(x=>x.id!==tid); refresh(); renderGlobalManager(); } }
function updateDomInfo(id, k, v) { SCHEMA.domains.find(d=>d.id===id)[k] = v; refresh(); }
function setView(v) { currentView=v; document.getElementById('cy').style.display=v==='graph'?'block':'none'; document.getElementById('excel-view').style.display=v==='excel'?'block':'none'; if(v==='excel') renderExcel(); }
function renderExcel() {
  const v = document.getElementById('excel-view'); v.innerHTML = '<h1 style="color:var(--cyan); margin-bottom:50px">MASTER REGISTRY</h1>';
  SCHEMA.domains.forEach(d => {
    let dh = `<div style="margin-bottom:60px"><div style="font-weight:900; color:${d.color}; border-bottom:1px solid ${d.color}; padding-bottom:10px; margin-bottom:20px">${d.name.toUpperCase()}</div>`;
    SCHEMA.tables.filter(t=>t.domain===d.id).forEach(t => {
      dh += `<div style="margin-bottom:20px"><b>${t.id}</b> <table class="spreadsheet" style="margin-top:10px"><tr>${t.columns.map(c=>`<th>${c.name}</th>`).join('')}</tr>`;
      (t.rows||[]).forEach(r => dh += `<tr>${t.columns.map(c=>`<td><input value="${r[c.name]||''}" onchange="updRow('${t.id}',0,'${c.name}',this.value)"></td>`).join('')}</tr>`);
      dh += '</table></div>';
    });
    v.innerHTML += dh + '</div>';
  });
}
function updRow(tid, i, c, v) { SCHEMA.tables.find(x=>x.id===tid).rows[i][c] = v; }
function addRow(tid) { const t = SCHEMA.tables.find(x=>x.id===tid); if(!t.rows) t.rows=[]; t.rows.push({}); setPanelTab('data'); }
function addCol() { const n = prompt("Col Name:"); if(n) { SCHEMA.tables.find(x=>x.id===selectedId).columns.push({name:n, type:'string'}); setPanelTab('schema'); } }
function delCol(n) { const t = SCHEMA.tables.find(x=>x.id===selectedId); t.columns = t.columns.filter(c=>c.name!==n); setPanelTab('schema'); }
function openRelModal() { const target = prompt("Target Table ID:"); if(target) { SCHEMA.tables.find(x=>x.id===selectedId).relations.push({ target, type: '1:N', label: 'owns' }); refresh(); setPanelTab('links'); } }
function exportSchema() { const b = new Blob([JSON.stringify(SCHEMA, null, 2)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sub3d_modded_schema.json'; a.click(); }
function openNewTableModal(dom = 1) { const n = prompt("Table ID:"); if(n) { SCHEMA.tables.push({ id: n, domain: dom, columns:[{name:'id',type:'string',pk:true}], relations:[], rows:[] }); refresh(); select(n); } }
function renderSidebar() {
  let h = ''; SCHEMA.domains.forEach(d => {
    h += `<div class="sb-header">${d.name}</div>`;
    SCHEMA.tables.filter(t=>t.domain===d.id).forEach(t => h += `<div class="sb-item ${t.id===selectedId?'selected':''}" onclick="select('${t.id}')"><div class="sb-dot" style="background:${d.color}"></div>${t.id}</div>`);
  });
  document.getElementById('sidebar-content').innerHTML = h;
}
function refresh() { cy.json({ elements: buildElements() }); cy.nodes().forEach(n => { if (positions[n.id()]) n.position(positions[n.id()]); }); renderSidebar(); }
</script>
</body>
</html>
