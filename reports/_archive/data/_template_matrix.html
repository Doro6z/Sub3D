<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-black: #020408; --bg-surface: #0a0e16; --bg-glass: rgba(15, 23, 42, 0.7);
    --border: rgba(56, 189, 248, 0.15); --border-focus: rgba(56, 189, 248, 0.4);
    --text-p: #f8fafc; --text-s: #94a3b8; --text-d: #475569;
    --cyan: #06b6d4; --cyan-l: #22d3ee; --ruby: #ef4444; --emerald: #10b981; --amber: #f59e0b;
    --sidebar-w: 300px; --panel-w: 500px; --top-h: 64px;
  }
  html, body { height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; background: var(--bg-black); color: var(--text-p); }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .glass { background: var(--bg-glass); backdrop-filter: blur(20px); border-left: 1px solid var(--border); }
  
  /* UI BUTTONS */
  .btn {
    font-size: 10px; font-weight: 800; padding: 10px 18px; border: 1px solid var(--border);
    background: rgba(30, 41, 59, 0.4); color: var(--text-s); cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.15em; border-radius: 4px; transition: 0.15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { border-color: var(--cyan); color: var(--text-p); background: rgba(56, 189, 248, 0.1); }
  .btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }
  .btn.primary { background: var(--cyan); color: #000; border-color: var(--cyan); }
  .btn.danger { color: var(--ruby); border-color: rgba(239, 68, 68, 0.2); }
  .btn.danger:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--ruby); }

  /* NAVIGATION */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--top-h);
    background: var(--bg-surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; z-index: 1000;
  }
  .logo { font-size: 18px; font-weight: 900; color: var(--cyan); letter-spacing: 0.35em; text-transform: uppercase; }
  
  #app-root { position: fixed; top: var(--top-h); left: 0; right: 0; bottom: 0; display: flex; }

  /* SIDEBAR 2.0 */
  #sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sb-search { padding: 20px; border-bottom: 1px solid var(--border); }
  #sb-search input { width: 100%; padding: 12px 14px; background: #000; border: 1px solid var(--border); color: var(--text-p); border-radius: 4px; outline: none; font-size: 12px; }
  #sidebar-scroll { flex: 1; overflow-y: auto; padding: 15px 0; }
  .sb-group { margin-bottom: 24px; }
  .sb-hdr { padding: 8px 24px; font-size: 10px; font-weight: 900; color: var(--text-d); text-transform: uppercase; letter-spacing: 0.25em; display: flex; justify-content: space-between; align-items: center; }
  .sb-item { padding: 9px 24px 9px 42px; font-size: 12px; font-weight: 500; color: var(--text-s); cursor: pointer; display: flex; align-items: center; gap: 12px; border-left: 3px solid transparent; }
  .sb-item:hover { color: var(--text-p); background: rgba(255,255,255,0.02); }
  .sb-item.selected { background: rgba(56, 189, 248, 0.08); color: var(--cyan); font-weight: 800; border-left-color: var(--cyan); }
  .led { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .sb-count { margin-left: auto; font-size: 10px; color: var(--text-d); letter-spacing: 0.1em; }

  /* VIEWPORT */
  #viewport { position: relative; flex: 1; background: var(--bg-black); overflow: hidden; }
  #cy { 
    width: 100%; height: 100%; outline: none;
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  #hud { position: absolute; bottom: 30px; left: 30px; pointer-events: none; }
  .hud-line { font-size: 10px; font-weight: 900; color: var(--cyan); opacity: 0.4; letter-spacing: 0.15em; margin-bottom: 4px; }

  /* DETAIL PANEL */
  #panel { width: var(--panel-w); flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-hdr { padding: 40px 40px 30px; border-bottom: 1px solid var(--border); }
  .panel-tabs { display: flex; gap: 8px; padding: 0 40px; margin-top: -20px; z-index: 10; cursor: default; }
  .tab { padding: 12px 24px; font-size: 10px; font-weight: 900; color: var(--text-d); text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
  .tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .panel-main { flex: 1; overflow-y: auto; padding: 40px; }

  /* DATA CARDS & FORMS */
  .card { background: rgba(15, 23, 42, 0.3); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
  .card-hdr { font-size: 10px; font-weight: 900; color: var(--cyan); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.2em; display: flex; justify-content: space-between; }
  .pill { font-size: 9px; font-weight: 900; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); letter-spacing: 0.2em; text-transform: uppercase; }
  .pill.high { color: var(--ruby); border-color: rgba(239, 68, 68, 0.4); }
  .pill.medium { color: var(--amber); border-color: rgba(245, 158, 11, 0.4); }
  .pill.low { color: var(--emerald); border-color: rgba(16, 185, 129, 0.4); }
  .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .meta-item { background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .meta-item label { display: block; font-size: 9px; font-weight: 900; color: var(--text-d); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; font-size: 9px; font-weight: 900; border-radius: 999px; border: 1px solid var(--border); color: var(--text-d); letter-spacing: 0.12em; text-transform: uppercase; margin-right: 6px; margin-top: 6px; }
  .chip.strong { color: var(--text-p); border-color: var(--border-focus); }
  .empty-state { font-size: 12px; color: var(--text-d); padding: 14px 0; }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 10px; font-weight: 900; color: var(--text-d); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.15em; }
  .field input, .field select { width: 100%; background: #000; border: 1px solid var(--border); color: var(--text-p); padding: 14px; border-radius: 4px; outline: none; font-size: 13px; }
  .field input:focus { border-color: var(--cyan); }

  /* EXCEL */
  #excel { position: absolute; inset: 0; background: var(--bg-black); z-index: 500; display: none; overflow-y: auto; padding: 80px; }
  .sheet { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sheet th { background: #000; color: var(--text-d); padding: 14px; text-align: left; border-bottom: 2px solid var(--border); font-size: 10px; font-weight: 900; text-transform: uppercase; }
  .sheet td { border-bottom: 1px solid var(--border); }
  .sheet input { width: 100%; height: 44px; background: transparent; border: none; color: #fff; padding: 0 14px; outline: none; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>

function initGraph() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: buildElements(),
    wheelSensitivity: 0.1, minZoom: 0.04, maxZoom: 4,
    style: [
      { selector: 'node', style: { 
        'background-color': 'data(color)', 'background-opacity': 0.12, 'border-color': 'data(color)', 'border-width': 2,
        'label': 'data(label)', 'color': '#fff', 'font-size': '12px', 'font-family': 'Outfit, sans-serif', 'font-weight': 'bold',
        'text-valign': 'center', 'text-halign': 'center', 'width': '290px', 'height': '85px',
        'shape': 'roundrectangle', 'text-wrap': 'wrap', 'text-max-width': '230px', 'text-justification': 'center',
        'text-events': 'yes'
      } },
      { selector: 'node[?isParent]', style: { 'background-opacity': 0.04, 'border-width': 1.5, 'border-color': 'data(color)', 'label': 'data(label)', 'text-valign': 'top', 'padding': 80, 'text-margin-y': -30, 'font-weight': '900', 'color': 'data(color)', 'font-size': '15px', 'letter-spacing': '0.2em' } },
      { selector: 'node:selected, node.highlighted', style: { 'background-opacity': 0.45, 'border-width': 5, 'z-index': 100 } },
      { selector: 'node.dimmed', style: { 'opacity': 0.12, 'text-opacity': 0.08 } },
      { selector: 'edge', style: { 'width': 2, 'line-color': '#1e293b', 'target-arrow-shape': 'triangle', 'target-arrow-color': '#1e293b', 'curve-style': 'bezier', 'label': 'data(label)', 'font-size': '10px', 'color': '#475569', 'text-background-opacity': 1, 'text-background-color': '#020408' } },
      { selector: 'edge.dimmed', style: { 'opacity': 0.1, 'text-opacity': 0.08 } }
    ]
  });

  if (Object.keys(positions).length === 0) {
    applyLogicalLayout();
  } else {
    cy.nodes().forEach(n => { if (positions[n.id()]) n.position(positions[n.id()]); });
    cy.fit(null, 100);
  }

  let panning = false, lastX, lastY;
  cy.on('mousedown', e => { if (e.originalEvent.button === 1) { panning=true; lastX=e.clientX; lastY=e.clientY; } });
  window.addEventListener('mousemove', e => { if(panning){ cy.panBy({ x: e.clientX-lastX, y: e.clientY-lastY }); lastX=e.clientX; lastY=e.clientY; } });
  window.addEventListener('mouseup', e => { if(e.button===1) panning=false; });

  cy.on('tap', 'node', e => { if(e.target.data('isParent')) selectDomain(parseInt(e.target.id().replace('domain_',''))); else select(e.target.id()); });
  cy.on('tap', e => { if(e.target === cy) renderGlobalManager(); });
  cy.on('dragfree', 'node', e => { positions[e.target.id()] = e.target.position(); localStorage.setItem(STORAGE_KEY, JSON.stringify(positions)); });

  setTimeout(() => { cy.style().update(); }, 600);
}

function buildElements() {
  const els = [];
  SCHEMA.domains.forEach(d => els.push({ data: { id: `domain_${d.id}`, label: d.name.toUpperCase(), color: d.color, isParent: true } }));
  SCHEMA.tables.forEach(t => { 
    const d = SCHEMA.domains.find(x => x.id === t.domain); 
    els.push({ data: { id: t.id, label: t.id.replace(/_/g, ' '), parent: t.domain === 0 ? null : `domain_${t.domain}`, color: d?.color || '#333', domainId: t.domain } }); 
  });
  SCHEMA.tables.forEach(t => (t.relations || []).forEach(r => els.push({ data: { id: `${t.id}_${r.target}`, source: t.id, target: r.target, label: r.type } })));
  return els;
}

function renderSidebar(filter = '') {

    }
  });
  document.getElementById('sidebar-scroll').innerHTML = h;
}
function filterSidebar(v) { sidebarFilter = v; renderSidebar(v); applyGraphFilter(v); }
function applyGraphFilter(filter) {
  if (!cy) return;
  const f = (filter || '').trim().toLowerCase();
  cy.nodes().removeClass('dimmed');
  cy.edges().removeClass('dimmed');
  if (!f) return;
  const matchIds = new Set(SCHEMA.tables.filter(t => t.id.toLowerCase().includes(f)).map(t => t.id));
  cy.nodes().forEach(n => {
    if (n.data('isParent')) return;
    if (!matchIds.has(n.id())) n.addClass('dimmed');
  });
  cy.edges().forEach(e => {
    const src = e.data('source');
    const tgt = e.data('target');
    if (!matchIds.has(src) && !matchIds.has(tgt)) e.addClass('dimmed');
  });
}

      if (c.fk) meta.push(`<span class="chip">FK ${c.fk}</span>`);
      if (c.nullable === false) meta.push('<span class="chip">NOT NULL</span>');
      if (c.default !== undefined) meta.push(`<span class="chip">DEFAULT ${c.default}</span>`);
      if (c.values) meta.push(`<span class="chip">ENUM ${c.values.join(' | ')}</span>`);
      html += `
        <div class="card mono">

function renameTable(tid) { 
  const n = prompt("NEW IDENTIFIER:", tid); 
  if(n && n !== tid) {
    SCHEMA.tables.find(x=>x.id===tid).id = n;
    SCHEMA.tables.forEach(t => (t.relations||[]).forEach(r => { if(r.target === tid) r.target = n; }));
    if(positions[tid]) { positions[n] = positions[tid]; delete positions[tid]; }
    refresh(); select(n);
  }
}
function deleteTable(tid) { if(confirm(`PURGE ${tid} PERMANENTLY?`)) { SCHEMA.tables = SCHEMA.tables.filter(x=>x.id!==tid); refresh(); renderGlobalManager(); } }
function addDomain() { const nid = Math.max(...SCHEMA.domains.map(d=>d.id)) + 1; SCHEMA.domains.push({id:nid, name:'New Cluster', color:'#38bdf8'}); refresh(); renderGlobalManager(); }
function delDomain(id) { if(SCHEMA.tables.find(t=>t.domain===id)) return alert("DOMAIN NOT EMPTY."); SCHEMA.domains = SCHEMA.domains.filter(d=>d.id!==id); refresh(); renderGlobalManager(); }
function addCol() { const n = prompt("Column Name:"); if(n) { SCHEMA.tables.find(x=>x.id===selectedId).columns.push({name:n, type:'string'}); setPanelTab('schema'); } }
function delCol(n) { const t = SCHEMA.tables.find(x=>x.id===selectedId); t.columns = t.columns.filter(c=>c.name!==n); setPanelTab('schema'); }
function addRow(tid) { const t = SCHEMA.tables.find(x=>x.id===tid); if(!t.rows) t.rows=[]; t.rows.push({}); if(currentView==='excel') renderExcel(); else setPanelTab('data'); }
function updRow(tid, i, c, v) { SCHEMA.tables.find(x=>x.id===tid).rows[i][c] = v; }
function delRel(i) { SCHEMA.tables.find(x=>x.id===selectedId).relations.splice(i,1); refresh(); setPanelTab('links'); }
function moveTable(tid, dm) { SCHEMA.tables.find(x=>x.id===tid).domain = dm; refresh(); if(selectedId===tid) select(tid); else if(selectedDomainId) selectDomain(selectedDomainId); }

function setView(v) {
  currentView = v; document.getElementById('btn-graph').classList.toggle('active', v==='graph'); document.getElementById('btn-excel').classList.toggle('active', v==='excel');
  document.getElementById('cy').style.display = v==='graph'?'block':'none'; document.getElementById('excel').style.display = v==='excel'?'block':'none';

}

function openRelModal() { const target = prompt("Target Table ID:"); if(target) { SCHEMA.tables.find(x=>x.id===selectedId).relations.push({ target, type: '1:N', label: 'owns' }); refresh(); setPanelTab('links'); } }
function openNewTableModal(domId = 0) { const n = prompt("Table ID:"); if(n) { SCHEMA.tables.push({ id: n, domain: domId, columns:[{name:'id',type:'string',pk:true}], relations:[], rows:[] }); refresh(); select(n); } }
function updateDomInfo(id, k, v) { SCHEMA.domains.find(d=>d.id===id)[k] = v; refresh(); if(selectedDomainId) selectDomain(id); }
function exportSchema() { const b = new Blob([JSON.stringify(SCHEMA, null, 2)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sub3d_modded_schema.json'; a.click(); }
function applyLogicalLayout() {
  const centers = {
    1: { x: 0, y: 0 },       // Hull & Authoring (CORE)
    2: { x: 1200, y: 0 },    // Modules & Stations (EAST)
    3: { x: -1200, y: 0 },   // Catalog & Product (WEST)
    7: { x: 0, y: 1200 },    // Breach & Flood (SOUTH)
    4: { x: 2400, y: 0 },    // Enemies & Fauna (FAR EAST)
    5: { x: 1200, y: 1200 }, // Items & Loot (SOUTH EAST)
    6: { x: 0, y: -1200 },   // World & Spawning (NORTH)
    8: { x: 1200, y: -1200 },// Mission & Rewards (NORTH EAST)
    9: { x: -1200, y: -1200 },// Difficulty & Economy (NORTH WEST)
    0: { x: -1200, y: 1200 } // Unassigned (SOUTH WEST)
  };

  const newPositions = {};
  SCHEMA.domains.forEach(d => {
    const center = centers[d.id] || { x: 0, y: 2400 };
    const tables = SCHEMA.tables.filter(t => t.domain === d.id);
    const cols = Math.ceil(Math.sqrt(tables.length));
    tables.forEach((t, i) => {
      const r = Math.floor(i / cols);
      const c = i % cols;
      newPositions[t.id] = { 
        x: center.x + (c - (cols-1)/2) * 450, 
        y: center.y + (r - (Math.ceil(tables.length/cols)-1)/2) * 200 
      };
    });
  });

  positions = newPositions;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
  
  if (cy) {
    cy.nodes().forEach(n => {
      if (positions[n.id()]) {
        n.animate({ position: positions[n.id()] }, { duration: 800 });
      }
    });
    setTimeout(() => cy.fit(null, 150), 900);
  }
}

function refresh() { 
  cy.json({ elements: buildElements() }); 
  cy.nodes().forEach(n => { if (positions[n.id()]) n.position(positions[n.id()]); });
  renderSidebar(); 
  applyGraphFilter(sidebarFilter);
  refreshStats();
}
</script>
