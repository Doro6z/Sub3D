<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sub3D · S01 — Unified HUD (L1 + L2 + L5)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:#0a0d12; --panel:#181c23; --panel-soft:#1d222a; --border:#2a313b; --border-hi:#3a4452;
    --text:#d8d4ca; --dim:#8d9095; --faint:#5e636a;
    --teal:#6db4a3; --teal-soft:#4f8478; --amber:#c89868; --gold:#d4b876; --leaf:#87a86b; --crimson:#b8554a;
    --ctx-yellow:#f4d03f;
    --paper:#d8c89c; --paper-dk:#c4b386; --paper-edge:#8a7148; --ink:#2a1a08; --ink-soft:#5a4528;
  }
  body { background: var(--bg-deep); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .viewport { background: radial-gradient(ellipse at 50% 38%, #14202a 0%, #0a1218 38%, #050709 80%), var(--bg-deep); }
  .crosshair { stroke: rgba(216,212,202,.5); stroke-width:1; }

  .preview-bar { background: rgba(5,8,12,.98); border-bottom: 1px solid var(--border); }
  .preview-btn { padding:3px 9px; border-radius:2px; font-size:11px; color:var(--dim); border:1px solid var(--border); background:rgba(15,20,28,.6); }
  .preview-btn:hover { color:var(--text); border-color:var(--border-hi); }
  .preview-btn-active { background:rgba(109,180,163,.12); border-color:var(--teal); color:var(--teal); }
  .panel { background: rgba(24,28,35,.92); border: 1px solid var(--border); border-radius: 4px; }

  .key { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px; background:#0e1218; border:1px solid #2e3640; border-bottom-width:2px; border-radius:3px; font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600; color:#cbcab9; text-transform:uppercase; }
  .slot { width:46px; height:46px; background:#0e1218; border:1px solid #2c333d; border-radius:3px; position:relative; display:flex; align-items:center; justify-content:center; }
  .slot-active { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(212,184,118,.3); }
  .slot-num { position:absolute; top:3px; left:4px; font-family:"JetBrains Mono",monospace; font-size:9px; color:rgba(141,144,149,.8); }

  /* ─── L1: heart pulse icon ────────────────────────── */
  .heart-icon { transform-origin:center; animation: heart-beat var(--hr,1s) ease-in-out infinite; }
  @keyframes heart-beat { 0%,70%,100%{transform:scale(1);} 20%{transform:scale(1.18);} 40%{transform:scale(1.04);} }

  /* ─── L1: Camera FX ambient layer ─────────────────── */
  .cam-fx { position: absolute; inset: 36px 0 0 0; pointer-events: none; transition: opacity .8s; }
  .fx-breath { background: radial-gradient(ellipse at 50% 100%, rgba(216,232,238,.06), transparent 50%); opacity:0; animation: breath 4s ease-in-out infinite; }
  .winded .fx-breath, .exhausted .fx-breath { opacity: 1; }
  .exhausted .fx-breath { animation-duration: 2s; background: radial-gradient(ellipse at 50% 100%, rgba(216,232,238,.12), transparent 60%); }
  @keyframes breath { 0%,100% { background-size: 100% 100%; } 50% { background-size: 110% 110%; } }

  .fx-hurt { box-shadow: inset 0 0 200px 30px rgba(184,85,74,.0); transition: box-shadow .8s; }
  .hurt .fx-hurt { box-shadow: inset 0 0 240px 50px rgba(184,85,74,.4); animation: pulse-hurt 1.5s ease-in-out infinite; }
  @keyframes pulse-hurt { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ─── L5: Context system ──────────────────────────── */
  .ctx-host { position:absolute; left:50%; top:50%; transform: translate(-50%, -50%); pointer-events:none; }
  .ctx-icon-wrap { position:absolute; left:50%; top:50%; transform: translate(-50%, -50%); transition: opacity .25s, transform .2s; opacity: 0; }
  .ctx-icon-wrap.show { opacity: 1; }
  .ctx-icon-wrap svg { stroke: var(--gold); }

  .crosshair-svg { position:absolute; left:50%; top:50%; transform: translate(-50%, -50%); transition: opacity .2s; opacity: 1; }
  .ctx-active .crosshair-svg { opacity: 0; }

  .ctx-label {
    position: absolute; left: 50%; top: 50%;
    transform: translate(20px, -10px);
    background: rgba(8, 12, 17, .94);
    border: 1px solid rgba(244, 208, 63, .6);
    border-left-width: 2px;
    border-radius: 2px;
    padding: 6px 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease-out;
    transition-delay: 0s;
  }
  .ctx-label.show { opacity: 1; transition-delay: .15s; }
  .ctx-type {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ctx-yellow);
  }
  .ctx-name {
    font-size: 12px; color: #e8e5dc; margin-top: 1px;
    font-weight: 500;
  }
  .ctx-keyhint { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 10px; color: var(--text); }

  /* ─── L2: Statut Personnage — hybride carnet qui sort ─── */
  .statut {
    position: absolute;
    bottom: 16px; right: 16px;
    width: 156px; height: 100px;
    transform-origin: bottom right;
    transform: scale(1) rotate(0deg);
    transition: width .45s cubic-bezier(.22, 1, .36, 1),
                height .45s cubic-bezier(.22, 1, .36, 1),
                transform .45s cubic-bezier(.22, 1, .36, 1),
                bottom .45s cubic-bezier(.22, 1, .36, 1),
                right .45s cubic-bezier(.22, 1, .36, 1);
    cursor: pointer;
    z-index: 20;
  }
  .statut.open {
    bottom: 32px; right: 32px;
    width: 540px; height: 360px;
    cursor: default;
    /* slight pop animation on open */
    animation: statut-pop .5s cubic-bezier(.22, 1, .36, 1);
  }
  @keyframes statut-pop {
    0%   { transform: scale(.4) rotate(-8deg) translate(60px, 60px); }
    60%  { transform: scale(1.02) rotate(.5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* Carnet chassis (cover + binding) */
  .statut-cover {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #2a1a08 0%, #1a0e04 100%);
    border: 1px solid #0a0604;
    border-radius: 4px;
    box-shadow: 0 -6px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
    transition: opacity .3s;
  }
  .statut.open .statut-cover { opacity: 1; }

  .statut-binding {
    position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 14px;
    background: linear-gradient(90deg, #1a0e04, #3a2510, #1a0e04);
    border-radius: 0 0 0 0;
    z-index: 2;
    transition: opacity .3s;
  }
  .statut-binding::before, .statut-binding::after {
    content:""; position: absolute; left: 4px; right: 4px; height: 6px;
    background: #0a0604; border-radius: 1px;
  }
  .statut-binding::before { top: 14%; }
  .statut-binding::after  { bottom: 14%; }

  /* Aperçu — what shows when statut is closed */
  .apercu {
    position: absolute; inset: 6px;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(180deg, var(--paper) 0%, #c4b386 100%);
    border: 1px solid var(--paper-edge);
    border-radius: 2px;
    padding: 8px 10px;
    color: var(--ink);
    overflow: hidden;
    transition: opacity .25s;
    box-shadow: inset 0 0 12px rgba(98, 76, 38, .2);
    display: flex; align-items: center; gap: 8px;
    z-index: 1;
  }
  .apercu::before {
    content:""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(80, 60, 30, .04) 1px, transparent 1px);
    background-size: 4px 4px;
    pointer-events: none;
  }
  .statut.open .apercu { opacity: 0; pointer-events: none; }

  .apercu-fig { flex-shrink: 0; }
  .apercu-bars {
    display: flex; flex-direction: column; gap: 5px; flex: 1;
    font-family: "JetBrains Mono", monospace;
  }
  .apercu-hp-row { display: flex; align-items: center; gap: 6px; }
  .apercu-hp-segs { display: flex; gap: 2px; }
  .apercu-hp-seg { width: 8px; height: 10px; background: var(--ink); border: 1px solid var(--ink-soft); }
  .apercu-hp-seg.empty { background: transparent; }
  .apercu-pulse { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink); }
  .apercu-status {
    font-family: "Caveat", "Brush Script MT", cursive;
    font-size: 14px; color: var(--ink); font-style: italic;
  }

  /* Opened state — main panel */
  .statut-pages {
    position: absolute; inset: 8px 8px 8px 22px;
    display: none;
    z-index: 1;
  }
  .statut.open .statut-pages { display: flex; }

  /* Lateral menu (left of opened carnet) */
  .statut-menu {
    width: 100px; padding: 12px 8px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(122, 96, 56, .12) 100%),
      var(--paper);
    border: 1px solid var(--paper-edge);
    border-right: none;
    border-radius: 2px 0 0 2px;
    display: flex; flex-direction: column; gap: 4px;
    color: var(--ink);
    box-shadow: inset 0 0 16px rgba(98, 76, 38, .15);
  }
  .menu-tab {
    padding: 8px 10px;
    font-family: "Caveat", "Brush Script MT", cursive;
    font-size: 16px; color: var(--ink-soft);
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: color .15s, border-left-color .15s, background .15s;
    text-align: left;
  }
  .menu-tab:hover { color: var(--ink); background: rgba(80,60,30,.08); }
  .menu-tab.active { color: var(--ink); border-left-color: var(--ink); background: rgba(80,60,30,.12); }
  .menu-tab.locked { color: var(--paper-edge); cursor: not-allowed; }
  .menu-tab.locked::after { content:" 🔒"; font-size:10px; color: var(--paper-edge); }

  /* Main page (right of opened carnet) */
  .statut-page {
    flex: 1;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(180deg, var(--paper) 0%, #c4b386 100%);
    border: 1px solid var(--paper-edge);
    border-radius: 0 2px 2px 0;
    padding: 16px 20px;
    color: var(--ink);
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 30px rgba(98, 76, 38, .2);
  }
  .statut-page::before {
    content:""; position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(80, 60, 30, .04) 1px, transparent 1px),
      linear-gradient(0deg, transparent 92%, rgba(80,60,30,.04) 93%, transparent 94%);
    background-size: 4px 4px, 100% 26px;
    pointer-events: none;
  }
  .ink-title {
    font-family: "Caveat", "Brush Script MT", cursive;
    font-size: 22px; color: var(--ink);
    border-bottom: 1px solid var(--ink-soft);
    padding-bottom: 4px; margin-bottom: 10px;
    transform: rotate(-.4deg);
  }
  .ink-row { display: flex; justify-content: space-between; padding: 2px 0; font-family: "Georgia", serif; font-size: 12px; color: var(--ink); }
  .ink-row .lbl { font-style: italic; color: var(--ink-soft); font-size: 11px; }
  .ink-bar { height: 8px; background: rgba(90,69,40,.15); border: 2px solid var(--ink); border-radius: 1px; overflow: hidden; transform: rotate(-.3deg); margin-top: 1px; }
  .ink-bar-fill { height: 100%; background: var(--ink); transition: width .35s; }

  /* Stick figure with hover zones */
  .body-svg-wrap {
    width: 100%; height: 160px;
    display: flex; justify-content: center;
    position: relative;
  }
  .body-svg { overflow: visible; }
  .limb-zone {
    fill: transparent;
    stroke: transparent;
    cursor: pointer;
    pointer-events: all;
  }
  .limb-zone:hover { fill: rgba(184,85,74,.08); }
  .limb-line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; fill: none; transition: stroke .2s; }
  .limb-line.injured { stroke: #9c5e1a; }
  .limb-line.crit { stroke: #9c2a1a; }

  .affliction-icon {
    position: absolute;
    transform: translate(-50%, -50%);
    background: rgba(216,200,156,.95);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Caveat", cursive;
    font-size: 12px; font-weight: bold;
    color: var(--ink);
    pointer-events: none;
    transform-origin: center;
    animation: aff-bounce 2.6s ease-in-out infinite;
  }
  @keyframes aff-bounce { 0%, 80%, 100% { transform: translate(-50%, -50%) scale(1); } 90% { transform: translate(-50%, -50%) scale(1.18); } }

  .limb-tooltip {
    position: absolute;
    background: rgba(216,200,156,.98);
    border: 1px solid var(--ink-soft);
    padding: 6px 10px;
    font-family: "Georgia", serif; font-size: 12px;
    color: var(--ink);
    pointer-events: none;
    opacity: 0; transition: opacity .15s;
    box-shadow: 2px 2px 6px rgba(0,0,0,.3);
    z-index: 5;
    white-space: nowrap;
  }
  .limb-tooltip.show { opacity: 1; }

  /* Pulse line ECG-style on the carnet */
  .pulse-svg {
    position: absolute; bottom: 12px; left: 18px; right: 18px;
    height: 16px;
    pointer-events: none;
  }
  .pulse-line {
    stroke: var(--ink-soft); stroke-width: 1.2; fill: none;
    stroke-dasharray: 200; stroke-dashoffset: 200;
    animation: pulse-sweep var(--pulse-dur, 1.6s) linear infinite;
  }
  @keyframes pulse-sweep { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: -200; } }

  /* Status text bar at bottom */
  .status-text {
    position: absolute; bottom: 32px; left: 18px; right: 18px;
    font-family: "Caveat", cursive; font-size: 14px; color: var(--ink-soft);
    font-style: italic;
  }

  /* Paper-flutter idle subtle anim on closed aperçu */
  .statut:not(.open) { animation: paper-breath 6s ease-in-out infinite; }
  @keyframes paper-breath {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50%      { transform: rotate(-.3deg) scale(1.005); }
  }
</style>
</head>
<body>

<!-- ─── Preview toolbar ─── -->
<div class="preview-bar fixed top-0 left-0 right-0 z-50 px-4 py-2 flex items-center gap-4 text-xs flex-wrap">
  <a href="index.html" class="text-teal-300 hover:underline mono font-bold text-xs">← gallery</a>
  <span class="text-slate-700">·</span>
  <span class="text-teal-300 mono font-bold">S01 UNIFIED HUD</span>
  <span class="text-slate-700">·</span>
  <span class="text-slate-500">L1 ambient · L2 Statut hybride carnet · L5 context auto</span>
  <div class="flex items-center gap-1.5"><span class="text-slate-500 uppercase mono">ctx:</span><div id="ctx-buttons" class="flex gap-1"></div></div>
  <div class="flex items-center gap-1.5"><span class="text-slate-500 uppercase mono">pose:</span><div id="pose-buttons" class="flex gap-1"></div></div>
  <div class="flex items-center gap-1.5"><span class="text-slate-500 uppercase mono">state:</span><div id="state-buttons" class="flex gap-1"></div></div>
  <div class="flex items-center gap-1.5 ml-auto"><span class="text-slate-500 uppercase mono">statut:</span>
    <button id="statut-toggle" class="preview-btn">closed</button>
  </div>
  <span class="text-slate-700 mono text-[10px]">key C · Esc</span>
</div>

<!-- ─── Game viewport ─── -->
<div id="vp" class="viewport relative w-screen h-screen pt-9">

  <!-- L1 Camera FX -->
  <div class="cam-fx fx-breath"></div>
  <div class="cam-fx fx-hurt"></div>

  <!-- L1 Crosshair (fades on context active) + L5 Context icon -->
  <div class="ctx-host">
    <svg class="crosshair-svg" width="14" height="14">
      <line class="crosshair" x1="7" y1="0" x2="7" y2="4"/><line class="crosshair" x1="7" y1="10" x2="7" y2="14"/>
      <line class="crosshair" x1="0" y1="7" x2="4" y2="7"/><line class="crosshair" x1="10" y1="7" x2="14" y2="7"/>
    </svg>
    <div id="ctx-icon-wrap" class="ctx-icon-wrap"></div>
  </div>

  <!-- L5 Context label (auto-reveal) -->
  <div id="ctx-label" class="ctx-label">
    <div class="ctx-type" id="ctx-type">—</div>
    <div class="ctx-name" id="ctx-name">—</div>
    <div class="ctx-keyhint">
      <span class="key">F</span><span id="ctx-action">—</span>
    </div>
  </div>

  <!-- L1 Hotbar bottom-center -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 panel p-1.5">
    <div class="flex gap-1.5">
      <div class="slot slot-active"><span class="slot-num">1</span><span class="text-base" style="color:var(--gold)">🔧</span></div>
      <div class="slot"><span class="slot-num">2</span><span class="text-base" style="color:var(--teal-soft)">✚</span></div>
      <div class="slot"><span class="slot-num">3</span><span class="text-base" style="color:var(--teal-soft)">⚡</span></div>
      <div class="slot"><span class="slot-num">4</span><span class="text-base" style="color:var(--teal-soft)">✺</span></div>
      <div class="slot"><span class="slot-num">5</span></div>
      <div class="slot"><span class="slot-num">6</span></div>
    </div>
  </div>

  <!-- L2 Statut Personnage — hybride carnet qui sort -->
  <div id="statut" class="statut" onclick="toggleStatut(event)">
    <div class="statut-cover"></div>
    <div class="statut-binding"></div>

    <!-- Aperçu visible when closed -->
    <div class="apercu">
      <div class="apercu-fig">
        <div id="apercu-pose-svg"></div>
      </div>
      <div class="apercu-bars">
        <div class="apercu-hp-row">
          <span class="apercu-pulse">
            <svg class="heart-icon" width="11" height="11" viewBox="0 0 24 24" fill="#5a4528"><path d="M12 21s-7-4.35-7-10a4.5 4.5 0 0 1 8.5-2 4.5 4.5 0 0 1 8.5 2c0 5.65-7 10-7 10z"/></svg>
          </span>
          <span class="apercu-hp-segs" id="apercu-hp-segs"></span>
        </div>
        <div class="apercu-status" id="apercu-status">Standing</div>
      </div>
    </div>

    <!-- Opened pages -->
    <div class="statut-pages">
      <!-- Lateral menu -->
      <div class="statut-menu" id="statut-menu">
        <div class="menu-tab active" data-tab="status">Status</div>
        <div class="menu-tab" data-tab="skills">Skills</div>
        <div class="menu-tab" data-tab="notes">Notes</div>
        <div class="menu-tab locked" data-tab="medical">Medical</div>
      </div>

      <!-- Main page -->
      <div class="statut-page">
        <div id="page-content"></div>

        <!-- Pulse ECG line at bottom -->
        <svg class="pulse-svg" viewBox="0 0 200 16">
          <path class="pulse-line" d="M0 8 L40 8 L46 8 L50 2 L54 14 L58 8 L62 8 L120 8 L126 8 L130 2 L134 14 L138 8 L142 8 L200 8"/>
        </svg>

        <!-- Status text -->
        <div class="status-text" id="status-line">Standing · 72 bpm steady</div>
      </div>
    </div>
  </div>

  <!-- Limb hover tooltip (positioned by JS) -->
  <div id="limb-tooltip" class="limb-tooltip"></div>

</div>

<!-- Notes panel bottom-center small -->
<div class="fixed bottom-1 left-1/2 -translate-x-1/2 panel px-3 py-1 text-[10px] text-slate-500 max-w-2xl text-center pointer-events-none mono uppercase tracking-wider" style="z-index: 60;">
  <span class="text-teal-300">S01</span> · L1 ambient · L2 carnet (click aperçu / press C) · L5 context auto on look-at
</div>

<script>
// ─── L5 Contexts ──────────────────────────────────────
const ICON_ATTRS = `width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"`;
const CONTEXTS = {
  none: null,
  loot: {
    type: "Loot", name: "Medical kit · 1×", action: "Pick up",
    icon: `<svg ${ICON_ATTRS}><path d="M8 11V5a2 2 0 0 1 4 0v6"/><path d="M12 11V3a2 2 0 0 1 4 0v8"/><path d="M16 11V5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-2a7 7 0 0 1-6.32-4l-2.5-5.16A1.7 1.7 0 0 1 4.5 9.7l1.5.8L8 12"/></svg>`
  },
  use: {
    type: "Station", name: "Helm console", action: "Activate",
    icon: `<svg ${ICON_ATTRS}><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M9 11h-2a2 2 0 0 0 0 4"/><path d="M13 7a2 2 0 0 1 4 0v6"/><path d="M17 11a2 2 0 0 1 2 2v3a6 6 0 0 1-6 6h-2a6 6 0 0 1-5.4-3.34L4 14"/></svg>`
  },
  door: {
    type: "Hatch", name: "Hatch ENG-02 → ENG-03", action: "Open",
    icon: `<svg ${ICON_ATTRS}><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 12h14"/><circle cx="15.5" cy="13" r="0.7" fill="currentColor"/></svg>`
  },
  repair: {
    type: "Damage", name: "Hull breach · 32%", action: "Patch",
    icon: `<svg ${ICON_ATTRS}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`
  },
  read: {
    type: "Note", name: "Captain's log · day 47", action: "Read",
    icon: `<svg ${ICON_ATTRS}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`
  }
};

// ─── L1 Postures ─────────────────────────────────────
const apercuPoseSvg = (paths, color) =>
  `<svg width="22" height="36" viewBox="0 0 22 36" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round">${paths}</svg>`;
const POSES = {
  standing: `<circle cx="11" cy="5" r="2"/><line x1="11" y1="7" x2="11" y2="20"/><line x1="11" y1="11" x2="7" y2="16"/><line x1="11" y1="11" x2="15" y2="16"/><line x1="11" y1="20" x2="8" y2="32"/><line x1="11" y1="20" x2="14" y2="32"/>`,
  crouched: `<circle cx="11" cy="9" r="2"/><line x1="11" y1="11" x2="11" y2="20"/><line x1="11" y1="14" x2="7" y2="18"/><line x1="11" y1="14" x2="15" y2="18"/><line x1="11" y1="20" x2="8" y2="26"/><line x1="8" y1="26" x2="8" y2="32"/><line x1="11" y1="20" x2="14" y2="26"/><line x1="14" y1="26" x2="14" y2="32"/>`,
  prone:    `<circle cx="3" cy="22" r="2"/><line x1="5" y1="22" x2="20" y2="22"/><line x1="8" y1="22" x2="11" y2="26"/><line x1="14" y1="22" x2="17" y2="26"/><line x1="20" y1="22" x2="22" y2="20"/>`,
  swimming: `<circle cx="4" cy="16" r="2"/><line x1="6" y1="16" x2="20" y2="16"/><line x1="8" y1="14" x2="11" y2="9"/><line x1="8" y1="18" x2="11" y2="23"/><line x1="20" y1="16" x2="22" y2="13"/>`
};

// ─── L2 Pages ────────────────────────────────────────
const PAGES = {
  status: () => `
    <div class="ink-title">Status · ${posTitleCase(state.pose)}</div>
    <div class="body-svg-wrap" id="body-wrap">
      <svg class="body-svg" id="body-svg" width="160" height="200" viewBox="-80 -10 160 220">
        <line class="limb-line" id="limb-torso" x1="0" y1="20" x2="0" y2="100"/>
        <circle class="limb-line" id="limb-head" fill="none" cx="0" cy="6" r="14"/>
        <line class="limb-line" id="limb-larm" x1="0" y1="36" x2="-40" y2="74"/>
        <line class="limb-line" id="limb-larm2" x1="-40" y1="74" x2="-44" y2="110"/>
        <line class="limb-line" id="limb-rarm" x1="0" y1="36" x2="40" y2="74"/>
        <line class="limb-line" id="limb-rarm2" x1="40" y1="74" x2="44" y2="110"/>
        <line class="limb-line" id="limb-lleg" x1="0" y1="100" x2="-22" y2="160"/>
        <line class="limb-line" id="limb-lleg2" x1="-22" y1="160" x2="-22" y2="200"/>
        <line class="limb-line" id="limb-rleg" x1="0" y1="100" x2="22" y2="160"/>
        <line class="limb-line" id="limb-rleg2" x1="22" y1="160" x2="22" y2="200"/>

        <!-- Hover zones (transparent) -->
        <circle class="limb-zone" data-limb="head"  data-name="Head"      data-default="OK · clear"     cx="0"   cy="6"   r="22"/>
        <rect   class="limb-zone" data-limb="torso" data-name="Torso"     data-default="OK · clear"     x="-22"  y="20"   width="44"  height="80"/>
        <rect   class="limb-zone" data-limb="larm"  data-name="Left arm"  data-default="OK"             x="-50"  y="36"   width="40"  height="80"/>
        <rect   class="limb-zone" data-limb="rarm"  data-name="Right arm" data-default="OK"             x="10"   y="36"   width="40"  height="80"/>
        <rect   class="limb-zone" data-limb="lleg"  data-name="Left leg"  data-default="OK"             x="-30"  y="100"  width="34"  height="100"/>
        <rect   class="limb-zone" data-limb="rleg"  data-name="Right leg" data-default="OK"             x="-4"   y="100"  width="34"  height="100"/>
      </svg>
    </div>
    <div style="margin-top:10px; padding: 0 4px;">
      <div class="ink-row" style="margin-bottom: 4px;"><span class="lbl">Health</span><span><strong id="hp-num">92</strong></span></div>
      <div class="ink-bar"><div class="ink-bar-fill" id="hp-bar" style="width:92%; background:var(--ink)"></div></div>
      <div class="ink-row" style="margin: 8px 0 4px;"><span class="lbl">Fatigue</span><span><strong id="fat-num">23</strong></span></div>
      <div class="ink-bar"><div class="ink-bar-fill" id="fat-bar" style="width:23%; background:#9c5e1a"></div></div>
      <div class="ink-row" style="margin: 8px 0 4px;"><span class="lbl">Experience</span><span><strong>42 / 100</strong></span></div>
      <div class="ink-bar"><div class="ink-bar-fill" style="width:42%; background:#3a5a2a"></div></div>
    </div>
  `,
  skills: () => `
    <div class="ink-title">Skills · 5 axes</div>
    <div style="font-family: 'Georgia', serif; font-size: 12px; color: var(--ink); line-height: 1.7;">
      ${[
        ["Métabolisme", 12, "+15 HP / pt · faim, fatigue, toxines"],
        ["Kinésie",     8,  "+5% vitesse · eau, pression, interaction"],
        ["Neurologie",  4,  "+5% précision · panique, O₂, sonar"],
        ["Physiologie", 6,  "−5% O₂ / pt · chaleur, froid, pression"],
        ["Technicité", 11,  "−5% réparation / pt · craft, recettes"]
      ].map(([n, v, d]) => `
        <div style="border-bottom: 1px dashed rgba(90,69,40,.3); padding: 4px 0;">
          <div style="display:flex; justify-content: space-between; align-items: baseline;">
            <span><strong style="font-family: 'Caveat', cursive; font-size: 16px;">${n}</strong></span>
            <span style="font-family: 'Caveat', cursive; font-size: 18px; color: var(--ink);">lv ${v}</span>
          </div>
          <div style="font-size: 10px; font-style: italic; color: var(--ink-soft);">${d}</div>
        </div>`).join("")}
      <div style="margin-top: 12px; font-style: italic; color: var(--ink-soft); font-size: 11px;">
        Statuts unlockables : Capitaine · Mécanicien · Plongeur EVA · Armurier · Artisan
      </div>
    </div>
  `,
  notes: () => `
    <div class="ink-title">Notes · Day 47</div>
    <div style="font-family: 'Caveat', cursive; font-size: 18px; color: var(--ink); line-height: 1.5;">
      Cruising at <span style="color:#1f3a6e">−1 240 m</span>, heading 047°.<br>
      ENG-02 groans like an old door.<br><br>
      <span style="color:#5a4528; font-size: 14px; font-style: italic;">— K., 15:21</span>
    </div>
    <div style="margin-top: 14px; font-size: 11px; font-family: 'Georgia', serif; font-style: italic; color: var(--ink-soft);">
      Free notes (placeholder) · post-FP this becomes the collective board (cf. GDD §social).
    </div>
  `,
  medical: () => `
    <div class="ink-title" style="opacity:.5;">Medical · locked</div>
    <div style="font-family: 'Georgia', serif; font-size: 12px; color: var(--ink-soft); line-height: 1.6; padding: 20px 0;">
      <div style="text-align: center; font-size: 32px; margin-bottom: 14px; opacity: .4;">🔒</div>
      Requires <strong>Medical scanner</strong> (crafted item).<br>
      Default access : none — opens after L6 unlock.<br><br>
      <em>Will show: per-crew detailed vitals, afflictions timeline, treatment options.</em>
    </div>
  `
};

function posTitleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ─── State ────────────────────────────────────────────
const state = {
  ctx: "use",
  pose: "standing",
  cond: "calm",
  open: false,
  tab: "status",
  injuries: { larm: "Light bruise", rleg: "Cut · bleeding light" }
};

const STATES = {
  calm:      { hp: 92, fat: 23, hr: 1.0,  pulse: "1.6s", bpm: "72 bpm steady",   mod: ""          },
  winded:    { hp: 92, fat: 64, hr: 0.7,  pulse: "1.0s", bpm: "98 bpm winded",   mod: "winded"    },
  hurt:      { hp: 32, fat: 41, hr: 0.55, pulse: "0.8s", bpm: "118 bpm hurt",    mod: "hurt"      },
  exhausted: { hp: 70, fat: 91, hr: 0.4,  pulse: "0.6s", bpm: "138 bpm gasping", mod: "exhausted" }
};

// ─── Render ───────────────────────────────────────────
function pillBtns(host, opts, sel, cb) {
  document.getElementById(host).innerHTML = opts
    .map(o => `<button data-v="${o}" class="preview-btn ${o===sel?'preview-btn-active':''}">${o}</button>`).join("");
  document.getElementById(host).querySelectorAll("button").forEach(b => b.addEventListener("click", () => cb(b.dataset.v)));
}

function renderToolbar() {
  pillBtns("ctx-buttons",   Object.keys(CONTEXTS),    state.ctx,  v => { state.ctx  = v; renderAll(); });
  pillBtns("pose-buttons",  Object.keys(POSES),       state.pose, v => { state.pose = v; renderAll(); });
  pillBtns("state-buttons", Object.keys(STATES),      state.cond, v => { state.cond = v; renderAll(); });
  document.getElementById("statut-toggle").classList.toggle("preview-btn-active", state.open);
  document.getElementById("statut-toggle").textContent = state.open ? "open" : "closed";
}

function renderL5() {
  const c = CONTEXTS[state.ctx];
  const wrap = document.getElementById("ctx-icon-wrap");
  const lbl  = document.getElementById("ctx-label");
  const host = document.querySelector(".ctx-host");
  if (!c) {
    host.classList.remove("ctx-active");
    wrap.classList.remove("show");
    lbl.classList.remove("show");
    return;
  }
  host.classList.add("ctx-active");
  wrap.innerHTML = c.icon;
  wrap.classList.add("show");
  lbl.classList.add("show");
  document.getElementById("ctx-type").textContent = c.type;
  document.getElementById("ctx-name").textContent = c.name;
  document.getElementById("ctx-action").textContent = c.action;
}

function renderApercu() {
  document.getElementById("apercu-pose-svg").innerHTML = apercuPoseSvg(POSES[state.pose], "var(--ink)");
  // 5-segment HP hatch
  const st = STATES[state.cond];
  const filled = Math.round(st.hp / 20);
  document.getElementById("apercu-hp-segs").innerHTML =
    Array.from({length: 5}, (_, i) => `<span class="apercu-hp-seg ${i < filled ? '' : 'empty'}"></span>`).join("");
  document.getElementById("apercu-status").textContent = posTitleCase(state.pose);
}

function renderL1() {
  const st = STATES[state.cond];
  document.documentElement.style.setProperty("--hr", `${st.hr}s`);
  document.documentElement.style.setProperty("--pulse-dur", st.pulse);
  document.getElementById("vp").classList.remove("calm","winded","hurt","exhausted");
  if (st.mod) document.getElementById("vp").classList.add(st.mod);
}

function renderL2Page() {
  if (!state.open) return;
  document.getElementById("page-content").innerHTML = PAGES[state.tab]();

  if (state.tab === "status") {
    const st = STATES[state.cond];
    document.getElementById("hp-num").textContent = st.hp;
    document.getElementById("hp-bar").style.width = `${st.hp}%`;
    document.getElementById("hp-bar").style.background = st.hp < 40 ? "#9c2a1a" : "var(--ink)";
    document.getElementById("fat-num").textContent = st.fat;
    document.getElementById("fat-bar").style.width = `${st.fat}%`;
    document.getElementById("status-line").textContent = `${posTitleCase(state.pose)} · ${st.bpm}`;

    // Apply injury class to limbs
    Object.keys(state.injuries).forEach(limb => {
      const cls = state.injuries[limb].includes("Cut") ? "crit" : "injured";
      const ids = limbToIds(limb);
      ids.forEach(id => {
        const el = document.getElementById(`limb-${id}`);
        if (el) el.classList.add(cls);
      });
    });

    // Hover handlers
    document.querySelectorAll(".limb-zone").forEach(z => {
      z.addEventListener("mouseenter", e => {
        const limb = z.dataset.limb;
        const inj  = state.injuries[limb];
        const text = inj ? `${z.dataset.name} · ${inj}` : `${z.dataset.name} · ${z.dataset.default}`;
        const tip = document.getElementById("limb-tooltip");
        tip.textContent = text;
        tip.classList.add("show");
      });
      z.addEventListener("mousemove", e => {
        const tip = document.getElementById("limb-tooltip");
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top  = (e.clientY - 24) + "px";
      });
      z.addEventListener("mouseleave", () => {
        document.getElementById("limb-tooltip").classList.remove("show");
      });
    });
  }
}

function limbToIds(limb) {
  return ({
    head:  ["head"],
    torso: ["torso"],
    larm:  ["larm","larm2"],
    rarm:  ["rarm","rarm2"],
    lleg:  ["lleg","lleg2"],
    rleg:  ["rleg","rleg2"]
  })[limb] || [];
}

function renderL2() {
  const s = document.getElementById("statut");
  s.classList.toggle("open", state.open);
  if (state.open) {
    // setup tab buttons
    document.querySelectorAll("#statut-menu .menu-tab").forEach(t => {
      t.classList.toggle("active", t.dataset.tab === state.tab);
      if (!t.classList.contains("locked")) {
        t.onclick = e => { e.stopPropagation(); state.tab = t.dataset.tab; renderL2Page(); renderL2(); };
      } else {
        t.onclick = e => { e.stopPropagation(); /* locked, no-op */ };
      }
    });
    renderL2Page();
  }
}

function renderAll() {
  renderToolbar();
  renderL5();
  renderApercu();
  renderL1();
  renderL2();
}

function toggleStatut(e) {
  if (e) e.stopPropagation();
  state.open = !state.open;
  renderAll();
}

// ─── Keyboard ─────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.open) { e.preventDefault(); state.open = false; renderAll(); return; }
  if (e.key.toLowerCase() === "c") { e.preventDefault(); state.open = !state.open; renderAll(); }
});

// Click outside to close
document.getElementById("vp").addEventListener("click", e => {
  if (state.open && !document.getElementById("statut").contains(e.target)) {
    state.open = false;
    renderAll();
  }
});

renderAll();
</script>
</body>
</html>
