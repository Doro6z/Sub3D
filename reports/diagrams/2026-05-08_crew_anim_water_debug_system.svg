<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Crew animation and water debug target system</title>
  <desc id="desc">Target architecture diagram for the Sub3D crew animation, water locomotion, and debug validation system.</desc>
  <defs>
    <style>
      .bg { fill: #11171b; }
      .panel { fill: #172126; stroke: #3a4b52; stroke-width: 2; }
      .panel-soft { fill: #141d21; stroke: #314047; stroke-width: 1.5; }
      .source { fill: #18252e; stroke: #4f7d9f; stroke-width: 2; }
      .target { fill: #1b2428; stroke: #7b8490; stroke-width: 2; }
      .snapshot { fill: #19282a; stroke: #35c7bd; stroke-width: 3; }
      .surface { fill: #211f27; stroke: #b18be8; stroke-width: 2; }
      .warn { fill: #2a2418; stroke: #e4a747; stroke-width: 2; }
      .good { fill: #143123; stroke: #40c878; stroke-width: 2; }
      .blocked { fill: #31191a; stroke: #df5b5b; stroke-width: 2; }
      .txt { fill: #e7eef0; font-family: Segoe UI, Arial, sans-serif; font-size: 20px; }
      .small { fill: #b7c5ca; font-family: Segoe UI, Arial, sans-serif; font-size: 15px; }
      .tiny { fill: #93a5ab; font-family: Segoe UI, Arial, sans-serif; font-size: 13px; }
      .title { fill: #f4fbfc; font-family: Segoe UI, Arial, sans-serif; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #b7c5ca; font-family: Segoe UI, Arial, sans-serif; font-size: 18px; }
      .section { fill: #f4fbfc; font-family: Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .label { fill: #d8e4e8; font-family: Segoe UI, Arial, sans-serif; font-size: 17px; font-weight: 600; }
      .chip-text { fill: #101719; font-family: Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.4px; }
      .chip-blue { fill: #6bb7e8; }
      .chip-orange { fill: #e4a747; }
      .chip-green { fill: #40c878; }
      .chip-gray { fill: #98a4aa; }
      .chip-red { fill: #df5b5b; }
      .arrow { stroke: #7fd8d1; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #6b7d84; stroke-width: 2; fill: none; marker-end: url(#arrowhead-soft); }
      .arrow-purple { stroke: #b18be8; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-purple); }
      .grid { stroke: #253137; stroke-width: 1; opacity: 0.45; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7fd8d1" />
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7d84" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b18be8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1100" />
  <g opacity="0.35">
    <path class="grid" d="M80 120 H1520" />
    <path class="grid" d="M80 260 H1520" />
    <path class="grid" d="M80 400 H1520" />
    <path class="grid" d="M80 540 H1520" />
    <path class="grid" d="M80 680 H1520" />
    <path class="grid" d="M80 820 H1520" />
    <path class="grid" d="M80 960 H1520" />
  </g>

  <text class="title" x="60" y="58">Crew animation + water debug target system</text>
  <text class="subtitle" x="60" y="88">Current status: Milestone 1 text debug core is in code. Next gate is PIE validation of CrewAnimDump before UI, overlays, CSV, and water resolver work.</text>

  <g transform="translate(1090 36)">
    <rect class="panel-soft" x="0" y="0" width="450" height="68" rx="8" />
    <text class="tiny" x="18" y="24">STATUS LEGEND</text>
    <rect class="chip-blue" x="18" y="36" width="66" height="20" rx="10" /><text class="chip-text" x="29" y="51">IN CODE</text>
    <rect class="chip-orange" x="98" y="36" width="86" height="20" rx="10" /><text class="chip-text" x="111" y="51">A VALIDER</text>
    <rect class="chip-gray" x="198" y="36" width="64" height="20" rx="10" /><text class="chip-text" x="211" y="51">CIBLE</text>
    <rect class="chip-green" x="276" y="36" width="66" height="20" rx="10" /><text class="chip-text" x="287" y="51">VALIDE</text>
    <rect class="chip-red" x="356" y="36" width="70" height="20" rx="10" /><text class="chip-text" x="370" y="51">BLOQUE</text>
  </g>

  <g transform="translate(60 135)">
    <rect class="panel" x="0" y="0" width="420" height="820" rx="10" />
    <text class="section" x="24" y="42">State sources</text>

    <g transform="translate(24 72)">
      <rect class="source" x="0" y="0" width="372" height="88" rx="8" />
      <text class="label" x="18" y="30">Input + camera</text>
      <text class="small" x="18" y="55">Move axis, vertical swim, control rotation</text>
      <rect class="chip-blue" x="274" y="14" width="72" height="22" rx="11" /><text class="chip-text" x="286" y="30">IN CODE</text>
    </g>

    <g transform="translate(24 178)">
      <rect class="source" x="0" y="0" width="372" height="112" rx="8" />
      <text class="label" x="18" y="30">USubCrewMovementComponent</text>
      <text class="small" x="18" y="56">EmbarkState, MovementMode, GridSpace</text>
      <text class="small" x="18" y="78">MoveIntent, LocomotionFrame, IK probes</text>
      <rect class="chip-blue" x="274" y="14" width="72" height="22" rx="11" /><text class="chip-text" x="286" y="30">IN CODE</text>
    </g>

    <g transform="translate(24 308)">
      <rect class="source" x="0" y="0" width="372" height="112" rx="8" />
      <text class="label" x="18" y="30">ASubCrewCharacter</text>
      <text class="small" x="18" y="56">Compartment, pressure, oxygen</text>
      <text class="small" x="18" y="78">Water height, immersion, hull crossing</text>
      <rect class="chip-blue" x="274" y="14" width="72" height="22" rx="11" /><text class="chip-text" x="286" y="30">IN CODE</text>
    </g>

    <g transform="translate(24 438)">
      <rect class="source" x="0" y="0" width="372" height="112" rx="8" />
      <text class="label" x="18" y="30">USubCrewAnimInstance</text>
      <text class="small" x="18" y="56">Walk, crawl, swim, breathing, posture</text>
      <text class="small" x="18" y="78">Sub motion, aim, rest pose, IK values</text>
      <rect class="chip-blue" x="274" y="14" width="72" height="22" rx="11" /><text class="chip-text" x="286" y="30">IN CODE</text>
    </g>

    <g transform="translate(24 568)">
      <rect class="source" x="0" y="0" width="372" height="112" rx="8" />
      <text class="label" x="18" y="30">FAnimNode_CrewProcedural</text>
      <text class="small" x="18" y="56">PreUpdate snapshot, resolved bones</text>
      <text class="small" x="18" y="78">Requested pose applied to output pose</text>
      <rect class="chip-blue" x="274" y="14" width="72" height="22" rx="11" /><text class="chip-text" x="286" y="30">IN CODE</text>
    </g>
  </g>

  <g transform="translate(555 135)">
    <rect class="snapshot" x="0" y="0" width="500" height="820" rx="10" />
    <text class="section" x="28" y="42">Shared validation core</text>
    <rect class="chip-blue" x="356" y="20" width="86" height="24" rx="12" /><text class="chip-text" x="372" y="37">IN CODE</text>

    <g transform="translate(28 72)">
      <rect class="panel-soft" x="0" y="0" width="444" height="98" rx="8" />
      <text class="label" x="18" y="30">UCrewAnimDebugComponent</text>
      <text class="small" x="18" y="56">Default subobject on ASubCrewCharacter</text>
      <text class="small" x="18" y="78">Samples after movement + mesh prerequisites</text>
    </g>

    <g transform="translate(28 190)">
      <rect class="panel-soft" x="0" y="0" width="444" height="360" rx="8" />
      <text class="label" x="18" y="32">FCrewAnimDebugSnapshot</text>
      <text class="small" x="18" y="66">TraversalDomain</text>
      <text class="small" x="18" y="92">ReferenceFrameState</text>
      <text class="small" x="18" y="118">Raw EmbarkState + native MovementMode</text>
      <text class="small" x="18" y="144">WaterContactState + ImmersionSample</text>
      <text class="small" x="18" y="170">MoveIntent + LocomotionFrame</text>
      <text class="small" x="18" y="196">RequestedFinalPose</text>
      <text class="small" x="18" y="222">AppliedBoneTransforms</text>
      <text class="small" x="18" y="248">IK weights + applied bone transforms</text>
      <text class="small" x="18" y="274">Anim node health not exposed yet</text>
      <text class="small" x="18" y="300">Warnings as stable ids</text>
      <rect class="chip-blue" x="320" y="18" width="72" height="22" rx="11" /><text class="chip-text" x="332" y="34">IN CODE</text>
    </g>

    <g transform="translate(28 574)">
      <rect class="warn" x="0" y="0" width="444" height="176" rx="8" />
      <text class="label" x="18" y="32">Validation warnings</text>
      <text class="small" x="18" y="62">OutsideNotSwimming</text>
      <text class="small" x="18" y="88">AnimSwimMismatch</text>
      <text class="small" x="18" y="114">HandIKActiveDuringSwim / FootIKActiveDuringSwim</text>
      <text class="small" x="18" y="140">NoAnimInstance / RestPoseDominatesArm / GridVelocitySpike</text>
    </g>
  </g>

  <g transform="translate(1120 135)">
    <rect class="panel" x="0" y="0" width="420" height="820" rx="10" />
    <text class="section" x="24" y="42">Validation surfaces</text>

    <g transform="translate(24 72)">
      <rect class="surface" x="0" y="0" width="372" height="90" rx="8" />
      <text class="label" x="18" y="30">CrewAnimDump</text>
      <text class="small" x="18" y="56">In code; next PIE validation gate</text>
      <rect class="chip-blue" x="274" y="14" width="72" height="22" rx="11" /><text class="chip-text" x="286" y="30">IN CODE</text>
    </g>

    <g transform="translate(24 182)">
      <rect class="surface" x="0" y="0" width="372" height="90" rx="8" />
      <text class="label" x="18" y="30">Gameplay Debugger</text>
      <text class="small" x="18" y="56">Compact state for local + peers</text>
      <rect class="chip-gray" x="282" y="14" width="64" height="22" rx="11" /><text class="chip-text" x="296" y="30">CIBLE</text>
    </g>

    <g transform="translate(24 292)">
      <rect class="surface" x="0" y="0" width="372" height="90" rx="8" />
      <text class="label" x="18" y="30">UCrewAnimDebugPanelWidget</text>
      <text class="small" x="18" y="56">Editor-bound UMG diagnostic panel</text>
      <rect class="chip-gray" x="282" y="14" width="64" height="22" rx="11" /><text class="chip-text" x="296" y="30">CIBLE</text>
    </g>

    <g transform="translate(24 402)">
      <rect class="surface" x="0" y="0" width="372" height="90" rx="8" />
      <text class="label" x="18" y="30">3D draw debug</text>
      <text class="small" x="18" y="56">Frame axes, IK rays, selected bones</text>
      <rect class="chip-gray" x="282" y="14" width="64" height="22" rx="11" /><text class="chip-text" x="296" y="30">CIBLE</text>
    </g>

    <g transform="translate(24 512)">
      <rect class="surface" x="0" y="0" width="372" height="90" rx="8" />
      <text class="label" x="18" y="30">CSV trace</text>
      <text class="small" x="18" y="56">Compare repros before / after tuning</text>
      <rect class="chip-gray" x="282" y="14" width="64" height="22" rx="11" /><text class="chip-text" x="296" y="30">CIBLE</text>
    </g>

    <g transform="translate(24 642)">
      <rect class="good" x="0" y="0" width="372" height="108" rx="8" />
      <text class="label" x="18" y="30">Done condition</text>
      <text class="small" x="18" y="58">Dump, panel, debugger, draw and CSV</text>
      <text class="small" x="18" y="82">read the same snapshot and warnings.</text>
      <rect class="chip-green" x="282" y="14" width="64" height="22" rx="11" /><text class="chip-text" x="294" y="30">VALIDE</text>
    </g>
  </g>

  <path class="arrow" d="M480 250 C520 250, 520 250, 555 250" />
  <path class="arrow" d="M480 370 C520 370, 520 370, 555 370" />
  <path class="arrow" d="M480 500 C520 500, 520 500, 555 500" />
  <path class="arrow" d="M480 630 C520 630, 520 630, 555 630" />
  <path class="arrow-purple" d="M1055 260 C1090 260, 1090 260, 1120 250" />
  <path class="arrow-purple" d="M1055 375 C1090 375, 1090 375, 1120 360" />
  <path class="arrow-purple" d="M1055 490 C1090 490, 1090 490, 1120 470" />
  <path class="arrow-purple" d="M1055 605 C1090 605, 1090 605, 1120 580" />

  <g transform="translate(60 985)">
    <rect class="target" x="0" y="0" width="1480" height="72" rx="10" />
    <text class="label" x="22" y="30">Current gate</text>
    <text class="small" x="22" y="55">Run CrewAnimDump in PIE and confirm the snapshot/warnings. After that: movement hooks, AnimInstance hooks, node health, editor checklist, then UI/3D/CSV surfaces.</text>
  </g>
</svg>
