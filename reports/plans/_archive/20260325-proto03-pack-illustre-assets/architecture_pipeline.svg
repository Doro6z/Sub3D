<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif">
    <!-- Background -->
    <rect width="900" height="500" fill="#1e1e1e" rx="10"/>

    <!-- Title -->
    <text x="450" y="40" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">Data Flow Pipeline</text>

    <!-- Specs Input -->
    <rect x="50" y="200" width="220" height="100" rx="8" fill="#2d3436" stroke="#74b9ff" stroke-width="2"/>
    <text x="160" y="240" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">USubmarineGeneratorSpec</text>
    <text x="160" y="265" fill="#dfe6e9" font-size="14" font-style="italic" text-anchor="middle">Editor Input (DataAsset)</text>

    <!-- Arrow to Generator -->
    <path d="M 270 250 L 330 250" stroke="#74b9ff" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Generator Block -->
    <rect x="340" y="100" width="200" height="300" rx="10" fill="#2d3436" stroke="#a29bfe" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="440" y="130" fill="#a29bfe" font-size="16" font-weight="bold" text-anchor="middle">C++ Generator Pass</text>
    
    <rect x="360" y="150" width="160" height="35" rx="5" fill="#4a69bd"/>
    <text x="440" y="172" fill="#fff" font-size="14" text-anchor="middle">1. Hull Envelope</text>

    <rect x="360" y="195" width="160" height="35" rx="5" fill="#4a69bd"/>
    <text x="440" y="217" fill="#fff" font-size="14" text-anchor="middle">2. Interior Space</text>

    <rect x="360" y="240" width="160" height="35" rx="5" fill="#4a69bd"/>
    <text x="440" y="262" fill="#fff" font-size="14" text-anchor="middle">3. Bulkheads</text>

    <rect x="360" y="285" width="160" height="35" rx="5" fill="#4a69bd"/>
    <text x="440" y="307" fill="#fff" font-size="14" text-anchor="middle">4. Compartments</text>

    <rect x="360" y="330" width="160" height="35" rx="5" fill="#4a69bd"/>
    <text x="440" y="352" fill="#fff" font-size="14" text-anchor="middle">5. Flood Graph</text>

    <!-- Arrow to Definition -->
    <path d="M 540 250 L 610 250" stroke="#74b9ff" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Definition Output -->
    <rect x="620" y="200" width="230" height="100" rx="8" fill="#0984e3" stroke="#fff" stroke-width="3"/>
    <text x="735" y="240" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">USubmarineDefinition</text>
    <text x="735" y="265" fill="#fff" font-size="14" font-style="italic" text-anchor="middle">Runtime Source of Truth</text>

    <!-- Consumers -->
    <!-- Arrows -->
    <path d="M 735 300 L 735 330" stroke="#55efc4" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M 735 320 L 590 320 L 590 390" stroke="#55efc4" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
    <path d="M 735 320 L 880 320 L 880 390" stroke="#55efc4" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

    <rect x="520" y="390" width="140" height="50" rx="5" fill="#2d3436" stroke="#55efc4" stroke-width="1"/>
    <text x="590" y="410" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">USubFloodComponent</text>
    <text x="590" y="425" fill="#dfe6e9" font-size="10" text-anchor="middle">Water / Doors</text>

    <rect x="670" y="390" width="130" height="50" rx="5" fill="#2d3436" stroke="#55efc4" stroke-width="1"/>
    <text x="735" y="410" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">USubHullComponent</text>
    <text x="735" y="425" fill="#dfe6e9" font-size="10" text-anchor="middle">Damage / Collision</text>

    <rect x="810" y="390" width="140" height="50" rx="5" fill="#2d3436" stroke="#55efc4" stroke-width="1"/>
    <text x="880" y="410" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">SubMovementComp</text>
    <text x="880" y="425" fill="#dfe6e9" font-size="10" text-anchor="middle">Mass Physics</text>

    <!-- Defs -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#74b9ff" />
        </marker>
        <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#55efc4" />
        </marker>
    </defs>
</svg>
