  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>
<text class="title" x="60" y="62">Planche 7 - Architecture precise du premier sous-marin</text><text class="subtitle" x="60" y="98">Implantation detaillee en plan et en profil. La planche verrouille les besoins reels avant le design de surface.</text><rect class="panel" x="60" y="150" width="1120" height="500" rx="20" /><text class="h1" x="86" y="188" text-anchor="start"><tspan x="86" dy="0">Plan d&apos;implantation</tspan></text><path class="frame" d="M120 250 Q90 250 74 288 L60 338 L60 502 L74 552 Q90 590 120 590 L1114 590 Q1154 590 1172 542 L1184 494 L1184 346 L1172 298 Q1154 250 1114 250 Z" /><line class="grid" x1="190" y1="266" x2="190" y2="574" /><line class="grid" x1="400" y1="266" x2="400" y2="574" /><line class="grid" x1="610" y1="266" x2="610" y2="574" /><line class="grid" x1="848" y1="266" x2="848" y2="574" /><line class="grid" x1="1058" y1="266" x2="1058" y2="574" /><line class="bulkhead" x1="400" y1="278" x2="400" y2="562" /><line class="doorGap" x1="400" y1="364" x2="400" y2="430" /><line class="bulkhead" x1="610" y1="278" x2="610" y2="562" /><line class="doorGap" x1="610" y1="364" x2="610" y2="430" /><line class="bulkhead" x1="848" y1="278" x2="848" y2="562" /><line class="doorGap" x1="848" y1="364" x2="848" y2="430" /><rect class="ballFill" x="190" y="296" width="210" height="248" rx="22" /><rect class="navFill" x="400" y="296" width="210" height="248" rx="22" /><rect class="propFill" x="610" y="296" width="238" height="248" rx="22" /><rect class="confFill" x="848" y="296" width="210" height="248" rx="22" /><rect class="pathBand" x="228" y="370" width="724" height="94" rx="18" /><path class="dim" d="M248 417 L972 417" marker-end="url(#arrow)"/><text class="small" x="444" y="406" text-anchor="start"><tspan x="444" dy="0">Spine de circulation</tspan><tspan x="444" dy="22">joueur 1 &lt;-&gt; joueur 2</tspan></text><text class="h2" x="212" y="332" text-anchor="start"><tspan x="212" dy="0">A - Volume avant</tspan><tspan x="212" dy="24">ballast avant + service</tspan></text><rect class="tank" x="220" y="350" width="132" height="58" rx="14" /><text class="mono" x="236" y="384" text-anchor="start"><tspan x="236" dy="0">Ballast avant</tspan></text><rect class="panelAlt" x="224" y="470" width="150" height="52" rx="14" /><text class="small" x="242" y="500" text-anchor="start"><tspan x="242" dy="0">Vannes + manifold</tspan></text><path class="repair" d="M205 308 L205 532" /><text class="small" x="214" y="560" text-anchor="start"><tspan x="214" dy="0">Frontage reparable reserve</tspan></text><text class="h2" x="424" y="332" text-anchor="start"><tspan x="424" dy="0">B - Volume central</tspan><tspan x="424" dy="24">helm + radar</tspan></text><path class="navSolid" d="M482 510 Q520 458 558 510 L558 540 L482 540 Z" /><text class="mono" x="498" y="492" text-anchor="start"><tspan x="498" dy="0">Helm</tspan></text><rect class="senseSolid" x="454" y="350" width="160" height="52" rx="12" /><text class="mono" x="478" y="382" text-anchor="start"><tspan x="478" dy="0">Radar / sonar</tspan></text><rect class="panelAlt" x="448" y="544" width="156" height="34" rx="12" /><text class="small" x="470" y="566" text-anchor="start"><tspan x="470" dy="0">Zone de stance</tspan></text><path class="repair" d="M592 308 L592 532" /><text class="h2" x="634" y="332" text-anchor="start"><tspan x="634" dy="0">C - Volume machine</tspan><tspan x="634" dy="24">moteur + pompe + ballast arr.</tspan></text><rect class="propSolid" x="654" y="350" width="150" height="54" rx="14" /><text class="mono" x="676" y="382" text-anchor="start"><tspan x="676" dy="0">Station moteur</tspan></text><rect class="panelAlt" x="664" y="462" width="180" height="60" rx="14" /><text class="text" x="690" y="494" text-anchor="start"><tspan x="690" dy="0">Bloc moteur</tspan></text><rect class="ballSolid" x="862" y="350" width="120" height="54" rx="14" /><text class="mono" x="884" y="382" text-anchor="start"><tspan x="884" dy="0">Pompe</tspan></text><rect class="tank" x="856" y="462" width="104" height="58" rx="14" /><text class="small" x="868" y="492" text-anchor="start"><tspan x="868" dy="0">Ballast</tspan><tspan x="868" dy="20">arriere</tspan></text><path class="repair" d="M864 308 L864 532" /><text class="h2" x="872" y="332" text-anchor="start"><tspan x="872" dy="0">D - Volume arriere</tspan><tspan x="872" dy="24">local de sas + tronc</tspan></text><rect class="confSolid" x="886" y="350" width="116" height="54" rx="14" /><text class="mono" x="908" y="382" text-anchor="start"><tspan x="908" dy="0">Service</tspan></text><rect class="panelAlt" x="980" y="458" width="64" height="70" rx="12" /><text class="small" x="992" y="486" text-anchor="start"><tspan x="992" dy="0">Echelle</tspan><tspan x="992" dy="20">+ acces</tspan></text><path class="repair" d="M1022 308 L1022 532" /><rect class="panel" x="60" y="680" width="1120" height="510" rx="20" /><text class="h1" x="86" y="718" text-anchor="start"><tspan x="86" dy="0">Profil et besoins verticaux</tspan></text><path class="frame" d="M135 1020 Q90 1020 72 984 Q54 930 80 868 Q106 838 160 838 L1084 838 Q1160 842 1188 908 Q1210 930 1172 996 Q1150 1020 1090 1020 Z" /><line class="grid" x1="190" y1="848" x2="190" y2="1002" /><line class="grid" x1="400" y1="848" x2="400" y2="1002" /><line class="grid" x1="610" y1="848" x2="610" y2="1002" /><line class="grid" x1="848" y1="848" x2="848" y2="1002" /><line class="grid" x1="1058" y1="848" x2="1058" y2="1002" /><line class="bulkhead" x1="400" y1="860" x2="400" y2="988" /><line class="doorGap" x1="400" y1="946" x2="400" y2="1012" /><line class="bulkhead" x1="610" y1="860" x2="610" y2="988" /><line class="doorGap" x1="610" y1="946" x2="610" y2="1012" /><line class="bulkhead" x1="848" y1="860" x2="848" y2="988" /><line class="doorGap" x1="848" y1="946" x2="848" y2="1012" /><rect class="ballFill" x="214" y="874" width="152" height="82" rx="12" /><rect class="tank" x="228" y="958" width="128" height="42" rx="12" /><text class="mono" x="244" y="984" text-anchor="start"><tspan x="244" dy="0">Ballast avant</tspan></text><rect class="navFill" x="416" y="866" width="150" height="88" rx="12" /><path class="navSolid" d="M478 962 Q512 916 546 962 L546 986 L478 986 Z" /><text class="small" x="438" y="900" text-anchor="start"><tspan x="438" dy="0">Poste de commandement</tspan></text><rect class="propFill" x="622" y="860" width="216" height="96" rx="12" /><rect class="panelAlt" x="654" y="898" width="126" height="52" rx="12" /><text class="small" x="686" y="930" text-anchor="start"><tspan x="686" dy="0">Bloc moteur</tspan></text><rect class="tank" x="804" y="958" width="90" height="42" rx="12" /><text class="small" x="818" y="983" text-anchor="start"><tspan x="818" dy="0">Ballast arr.</tspan></text><rect class="confFill" x="870" y="862" width="124" height="92" rx="12" /><text class="small" x="890" y="900" text-anchor="start"><tspan x="890" dy="0">Local de sas</tspan></text><rect class="confFill" x="938" y="744" width="60" height="112" rx="12" /><rect class="confSolid" x="950" y="706" width="36" height="30" rx="8" /><text class="small" x="1008" y="724" text-anchor="start"><tspan x="1008" dy="0">Ecoutille plafond</tspan></text><text class="small" x="910" y="780" text-anchor="start"><tspan x="910" dy="0">Tronc dorsal</tspan></text><line class="whiteStroke" x1="968" y1="760" x2="968" y2="846" /><line class="whiteStroke" x1="956" y1="782" x2="980" y2="782" /><line class="whiteStroke" x1="956" y1="806" x2="980" y2="806" /><line class="whiteStroke" x1="956" y1="830" x2="980" y2="830" /><polygon class="danger" points="234,806 250,838 218,838" /><text class="small" x="268" y="832" text-anchor="start"><tspan x="268" dy="0">Breche avant = fuite + succion locale</tspan></text><polygon class="danger" points="700,790 716,822 684,822" /><text class="small" x="736" y="816" text-anchor="start"><tspan x="736" dy="0">Breche plafond = danger vertical</tspan></text><polygon class="danger" points="1030,804 1046,836 1014,836" /><text class="small" x="1062" y="830" text-anchor="start"><tspan x="1062" dy="0">Point haut = zone la plus exposee</tspan></text><path class="dim" d="M190 824 L1058 824" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="mono" x="624" y="808" text-anchor="middle"><tspan x="624" dy="0">12,4 m utiles</tspan></text><rect class="panel" x="1210" y="150" width="530" height="1040" rx="20" /><text class="h1" x="1238" y="188" text-anchor="start"><tspan x="1238" dy="0">Besoins verrouilles par le code</tspan></text><text class="text" x="1238" y="246" text-anchor="start"><tspan x="1238" dy="0">1. Deux masses de ballast existent deja : avant et arriere.</tspan><tspan x="1238" dy="34">2. Le helm reste le repere interieur principal.</tspan><tspan x="1238" dy="34">3. Le moteur et la pompe travaillent ensemble mais doivent se distinguer.</tspan><tspan x="1238" dy="34">4. Les portes sont du gameplay de confinement, pas du decor.</tspan><tspan x="1238" dy="34">5. Les frontages de reparation doivent rester reserves.</tspan><tspan x="1238" dy="34">6. Le premier sas recommande est dorsal, simple, a ecoutille.</tspan></text><text class="h2" x="1238" y="520" text-anchor="start"><tspan x="1238" dy="0">Dimensions de reference</tspan></text><text class="text" x="1238" y="562" text-anchor="start"><tspan x="1238" dy="0">Longueur exterieure : 15,2 m</tspan><tspan x="1238" dy="32">Longueur utile : 12,4 m</tspan><tspan x="1238" dy="32">Passage clair : 2,2 m a 2,3 m</tspan><tspan x="1238" dy="32">Porte claire : 1,2 m x 2,1 m</tspan><tspan x="1238" dy="32">Empreinte tronc : 1,1 m x 1,4 m</tspan><tspan x="1238" dy="32">Largeur echelle : 0,7 m a 0,8 m</tspan></text><text class="h2" x="1238" y="792" text-anchor="start"><tspan x="1238" dy="0">Choix retenu</tspan></text><text class="text" x="1238" y="834" text-anchor="start"><tspan x="1238" dy="0">On construit maintenant :</tspan><tspan x="1238" dy="32">local arriere + tronc dorsal + ecoutille simple.</tspan><tspan x="1238" dy="32">On reserve l&apos;enveloppe pour evoluer plus tard</tspan><tspan x="1238" dy="32">vers un micro-etage avec vrai sas a deux portes.</tspan></text><text class="h2" x="1238" y="1012" text-anchor="start"><tspan x="1238" dy="0">Ce qu&apos;il ne faut pas faire</tspan></text><text class="small" x="1238" y="1054" text-anchor="start"><tspan x="1238" dy="0">Ne pas caser dans D : sas, tourelle, trunk, service et decor au meme niveau.</tspan><tspan x="1238" dy="26">Ne pas faire un volume arriere trop petit pour y comprendre l&apos;echelle.</tspan><tspan x="1238" dy="26">Ne pas casser la spine centrale avec des machines saillantes.</tspan></text>
</svg>
