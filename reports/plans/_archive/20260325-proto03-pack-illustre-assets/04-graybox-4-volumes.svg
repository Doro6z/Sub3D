<svg viewBox="0 0 1800 1280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Graybox en 4 volumes</title>
  <desc id="desc">Blocage du premier sous-marin avec plan et profil alignes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4efe6"/>
    </marker>
    <style><![CDATA[
      .bg { fill: #0f1419; }
      .panel { fill: #172028; stroke: #43525d; stroke-width: 2; }
      .panelAlt { fill: #131b22; stroke: #34414a; stroke-width: 2; }
      .frame { fill: none; stroke: #9ca8af; stroke-width: 4; }
      .grid { fill: none; stroke: #34414a; stroke-width: 1; stroke-dasharray: 6 8; opacity: 0.45; }
      .bulkhead { stroke: #98a4ad; stroke-width: 8; }
      .doorGap { stroke: #0f1419; stroke-width: 14; }
      .repair { fill: none; stroke: #ead59b; stroke-width: 4; stroke-dasharray: 12 10; }
      .pathBand { fill: #f0eadb; opacity: 0.12; stroke: #f4efe6; stroke-width: 2; }
      .dim { fill: none; stroke: #f4efe6; stroke-width: 2.2; }
      .danger { fill: #de5a49; }
      .ok { fill: #82c97b; }
      .warn { fill: #e3b65b; }
      .title { fill: #f4efe6; font: 700 42px Arial, 'Segoe UI', sans-serif; }
      .subtitle { fill: #d1c9b8; font: 19px Arial, 'Segoe UI', sans-serif; }
      .h1 { fill: #f4efe6; font: 700 28px Arial, 'Segoe UI', sans-serif; }
      .h2 { fill: #f4efe6; font: 700 22px Arial, 'Segoe UI', sans-serif; }
      .text { fill: #f4efe6; font: 19px Arial, 'Segoe UI', sans-serif; }
      .small { fill: #d1c9b8; font: 17px Arial, 'Segoe UI', sans-serif; }
      .mono { fill: #f4efe6; font: 17px Consolas, 'Courier New', monospace; }
      .navFill { fill: #4a3b17; stroke: #d4a93a; stroke-width: 2.5; }
      .ballFill { fill: #274854; stroke: #66b7c8; stroke-width: 2.5; }
      .propFill { fill: #233c61; stroke: #5a95dc; stroke-width: 2.5; }
      .confFill { fill: #4f3022; stroke: #c66e3a; stroke-width: 2.5; }
      .senseFill { fill: #4a341a; stroke: #bb8638; stroke-width: 2.5; }
      .navSolid { fill: #d4a93a; }
      .ballSolid { fill: #66b7c8; }
      .propSolid { fill: #5a95dc; }
      .confSolid { fill: #c66e3a; }
      .senseSolid { fill: #bb8638; }
      .whiteStroke { fill: none; stroke: #f4efe6; stroke-width: 3; }
      .tank { fill: #66b7c8; stroke: #d8f3fb; stroke-width: 2; }
      .tag { fill: #e7d8a2; }
      .tag2 { fill: #6a7c86; }
      .tagText { fill: #0f1419; font: 700 16px Arial, 'Segoe UI', sans-serif; }
      .tableLine { stroke: #34414a; stroke-width: 2; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>
<text class="title" x="60" y="62">Planche 4 - Graybox en 4 volumes</text><text class="subtitle" x="60" y="98">Blocage spatial minimal du premier sous-marin. Le plan et le profil partagent la meme grille en X.</text><rect class="panel" x="60" y="150" width="1120" height="470" rx="20" /><text class="h1" x="86" y="188" text-anchor="start"><tspan x="86" dy="0">Vue dessus de blocage</tspan></text><path class="frame" d="M120 250 Q90 250 74 288 L60 338 L60 472 L74 522 Q90 560 120 560 L1114 560 Q1154 560 1172 512 L1184 464 L1184 346 L1172 298 Q1154 250 1114 250 Z" /><line class="grid" x1="190" y1="266" x2="190" y2="544" /><line class="grid" x1="400" y1="266" x2="400" y2="544" /><line class="grid" x1="610" y1="266" x2="610" y2="544" /><line class="grid" x1="848" y1="266" x2="848" y2="544" /><line class="grid" x1="1058" y1="266" x2="1058" y2="544" /><line class="bulkhead" x1="400" y1="278" x2="400" y2="532" /><line class="doorGap" x1="400" y1="364" x2="400" y2="430" /><line class="bulkhead" x1="610" y1="278" x2="610" y2="532" /><line class="doorGap" x1="610" y1="364" x2="610" y2="430" /><line class="bulkhead" x1="848" y1="278" x2="848" y2="532" /><line class="doorGap" x1="848" y1="364" x2="848" y2="430" /><rect class="ballFill" x="190" y="286" width="210" height="238" rx="22" /><rect class="navFill" x="400" y="286" width="210" height="238" rx="22" /><rect class="propFill" x="610" y="286" width="238" height="238" rx="22" /><rect class="confFill" x="848" y="286" width="210" height="238" rx="22" /><rect class="pathBand" x="230" y="356" width="748" height="92" rx="18" /><path class="dim" d="M250 402 L1000 402" marker-end="url(#arrow)"/><text class="small" x="430" y="395" text-anchor="start"><tspan x="430" dy="0">Bande de circulation principale</tspan></text><rect class="tank" x="214" y="324" width="132" height="56" rx="14" /><text class="mono" x="230" y="358" text-anchor="start"><tspan x="230" dy="0">Ballast avant</tspan></text><rect class="panelAlt" x="228" y="454" width="134" height="50" rx="14" /><text class="small" x="244" y="485" text-anchor="start"><tspan x="244" dy="0">Service ballast</tspan></text><path class="navSolid" d="M470 492 Q520 428 570 492 L570 522 L470 522 Z" /><text class="mono" x="498" y="472" text-anchor="start"><tspan x="498" dy="0">Helm</tspan></text><rect class="senseSolid" x="448" y="324" width="150" height="50" rx="12" /><text class="mono" x="470" y="356" text-anchor="start"><tspan x="470" dy="0">Radar / sonar</tspan></text><rect class="propSolid" x="654" y="324" width="150" height="54" rx="14" /><text class="mono" x="680" y="358" text-anchor="start"><tspan x="680" dy="0">Station moteur</tspan></text><rect class="panelAlt" x="666" y="446" width="176" height="58" rx="14" /><text class="text" x="690" y="478" text-anchor="start"><tspan x="690" dy="0">Bloc moteur</tspan></text><rect class="ballSolid" x="870" y="324" width="118" height="54" rx="14" /><text class="mono" x="890" y="358" text-anchor="start"><tspan x="890" dy="0">Pompe</tspan></text><rect class="tank" x="866" y="446" width="96" height="58" rx="14" /><text class="small" x="882" y="478" text-anchor="start"><tspan x="882" dy="0">Ballast arriere</tspan></text><rect class="confSolid" x="896" y="324" width="124" height="52" rx="14" /><text class="small" x="918" y="356" text-anchor="start"><tspan x="918" dy="0">Local arriere</tspan></text><rect class="panelAlt" x="964" y="446" width="72" height="58" rx="12" /><text class="small" x="977" y="478" text-anchor="start"><tspan x="977" dy="0">Tronc</tspan><tspan x="977" dy="20">de sas</tspan></text><path class="dim" d="M190 228 L1058 228" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="mono" x="522" y="214" text-anchor="middle"><tspan x="522" dy="0">Longueur utile interieure : 12,4 m</tspan></text><path class="dim" d="M90 194 L1184 194" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="mono" x="634" y="180" text-anchor="middle"><tspan x="634" dy="0">Longueur exterieure cible : 15,2 m</tspan></text><rect class="panel" x="60" y="650" width="1120" height="540" rx="20" /><text class="h1" x="86" y="688" text-anchor="start"><tspan x="86" dy="0">Vue de profil de blocage</tspan></text><path class="frame" d="M135 985 Q90 985 72 949 Q54 895 80 833 Q106 803 160 803 L1084 803 Q1160 807 1188 873 Q1210 895 1172 961 Q1150 985 1090 985 Z" /><line class="grid" x1="190" y1="817" x2="190" y2="969" /><line class="grid" x1="400" y1="817" x2="400" y2="969" /><line class="grid" x1="610" y1="817" x2="610" y2="969" /><line class="grid" x1="848" y1="817" x2="848" y2="969" /><line class="grid" x1="1058" y1="817" x2="1058" y2="969" /><line class="bulkhead" x1="400" y1="825" x2="400" y2="953" /><line class="doorGap" x1="400" y1="911" x2="400" y2="977" /><line class="bulkhead" x1="610" y1="825" x2="610" y2="953" /><line class="doorGap" x1="610" y1="911" x2="610" y2="977" /><line class="bulkhead" x1="848" y1="825" x2="848" y2="953" /><line class="doorGap" x1="848" y1="911" x2="848" y2="977" /><rect class="ballFill" x="210" y="840" width="156" height="82" rx="12" /><rect class="tank" x="226" y="924" width="130" height="42" rx="12" /><text class="mono" x="244" y="950" text-anchor="start"><tspan x="244" dy="0">Ballast avant</tspan></text><rect class="navFill" x="412" y="832" width="150" height="88" rx="12" /><path class="navSolid" d="M472 928 Q506 884 540 928 L540 952 L472 952 Z" /><text class="small" x="438" y="866" text-anchor="start"><tspan x="438" dy="0">Helm + poste</tspan></text><rect class="propFill" x="622" y="826" width="216" height="96" rx="12" /><rect class="panelAlt" x="654" y="864" width="122" height="52" rx="12" /><text class="small" x="684" y="896" text-anchor="start"><tspan x="684" dy="0">Bloc moteur</tspan></text><rect class="tank" x="804" y="924" width="90" height="40" rx="12" /><text class="small" x="818" y="949" text-anchor="start"><tspan x="818" dy="0">Ballast arr.</tspan></text><rect class="confFill" x="870" y="828" width="118" height="92" rx="12" /><text class="small" x="892" y="866" text-anchor="start"><tspan x="892" dy="0">Local arriere</tspan></text><rect class="confFill" x="932" y="710" width="62" height="112" rx="12" /><rect class="confSolid" x="946" y="676" width="34" height="28" rx="8" /><text class="small" x="1008" y="694" text-anchor="start"><tspan x="1008" dy="0">Ecoutille</tspan></text><text class="small" x="902" y="744" text-anchor="start"><tspan x="902" dy="0">Tronc</tspan><tspan x="902" dy="22">de sas</tspan></text><line class="whiteStroke" x1="963" y1="726" x2="963" y2="812" /><line class="whiteStroke" x1="950" y1="746" x2="976" y2="746" /><line class="whiteStroke" x1="950" y1="770" x2="976" y2="770" /><line class="whiteStroke" x1="950" y1="794" x2="976" y2="794" /><polygon class="danger" points="232,780 248,812 216,812" /><text class="small" x="264" y="804" text-anchor="start"><tspan x="264" dy="0">Bande de brèche avant</tspan></text><polygon class="danger" points="694,762 710,794 678,794" /><text class="small" x="730" y="786" text-anchor="start"><tspan x="730" dy="0">Bande de brèche plafond</tspan></text><polygon class="danger" points="1032,778 1048,810 1016,810" /><text class="small" x="1064" y="802" text-anchor="start"><tspan x="1064" dy="0">Point haut expose</tspan></text><rect class="panel" x="1210" y="150" width="530" height="470" rx="20" /><text class="h1" x="1238" y="188" text-anchor="start"><tspan x="1238" dy="0">Regles du blocage</tspan></text><text class="text" x="1238" y="240" text-anchor="start"><tspan x="1238" dy="0">1. Quatre volumes seulement.</tspan><tspan x="1238" dy="34">2. Trois bulkheads lisibles.</tspan><tspan x="1238" dy="34">3. Une bande centrale pour la circulation.</tspan><tspan x="1238" dy="34">4. Le moteur reste hors de l&apos;axe principal.</tspan><tspan x="1238" dy="34">5. Le premier sas est un tronc dorsal simple.</tspan><tspan x="1238" dy="34">6. Ballast avant et ballast arriere existent deja au graybox.</tspan></text><text class="small" x="1238" y="470" text-anchor="start"><tspan x="1238" dy="0">Decision :</tspan><tspan x="1238" dy="24">le premier proto ne tente pas encore un vrai micro-etage.</tspan><tspan x="1238" dy="24">On reserve simplement la masse du tronc dorsal pour l&apos;evolution future.</tspan></text><rect class="panel" x="1210" y="650" width="530" height="540" rx="20" /><text class="h1" x="1238" y="688" text-anchor="start"><tspan x="1238" dy="0">Cotes a respecter en modelisation</tspan></text><text class="text" x="1238" y="744" text-anchor="start"><tspan x="1238" dy="0">Longueur exterieure cible : 15,2 m</tspan><tspan x="1238" dy="34">Longueur utile interieure : 12,4 m</tspan><tspan x="1238" dy="34">Passage principal : 2,2 m a 2,3 m</tspan><tspan x="1238" dy="34">Porte claire : 1,2 m x 2,1 m</tspan><tspan x="1238" dy="34">Hauteur libre interieure : 2,35 m</tspan><tspan x="1238" dy="34">Empreinte minimale du tronc : 1,1 m x 1,4 m</tspan><tspan x="1238" dy="34">Largeur d&apos;echelle : 0,7 m a 0,8 m</tspan><tspan x="1238" dy="34">Frontages reparables : 1,3 m min sur murs utiles</tspan></text><text class="small" x="1238" y="1048" text-anchor="start"><tspan x="1238" dy="0">Validation :</tspan><tspan x="1238" dy="24">si un joueur ne sait pas ou couper la propagation,</tspan><tspan x="1238" dy="24">ou il repond pour plonger, le blocage est encore mauvais.</tspan></text>
</svg>
