<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="sans-serif">
    <!-- Background -->
    <rect width="1000" height="600" fill="#1e1e1e" rx="10"/>

    <!-- Title -->
    <text x="500" y="40" fill="#fff" font-size="24" font-weight="bold" text-anchor="middle">Integrated Submarine Systems (Target State)</text>

    <!-- Central Source of Truth -->
    <rect x="350" y="100" width="300" height="120" rx="15" fill="#0984e3" stroke="#fff" stroke-width="4"/>
    <text x="500" y="145" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">USubmarineDefinition</text>
    <text x="500" y="170" fill="#dfe6e9" font-size="14" font-style="italic" text-anchor="middle">Pre-baked Geometry, Flood Graph,</text>
    <text x="500" y="190" fill="#dfe6e9" font-size="14" font-style="italic" text-anchor="middle">Stations &amp; Spawn Points</text>

    <!-- Components -->
    <!-- SubFloodComponent -->
    <rect x="50" y="280" width="250" height="150" rx="10" fill="#2d3436" stroke="#74b9ff" stroke-width="2"/>
    <text x="175" y="315" fill="#74b9ff" font-size="16" font-weight="bold" text-anchor="middle">USubFloodComponent</text>
    <path d="M 50 330 L 300 330" stroke="#74b9ff" stroke-width="1" stroke-dasharray="4"/>
    <text x="65" y="355" fill="#fff" font-size="13">● Water Level Authority (Liters)</text>
    <text x="65" y="375" fill="#fff" font-size="13">● Door/Edge Resolver</text>
    <text x="65" y="395" fill="#fff" font-size="13">● Pump Management</text>
    <text x="65" y="415" fill="#fff" font-size="13">● Spatial Resolver (FindCompAtLoc)</text>

    <!-- SubHullComponent -->
    <rect x="700" y="280" width="250" height="150" rx="10" fill="#2d3436" stroke="#ff7675" stroke-width="2"/>
    <text x="825" y="315" fill="#ff7675" font-size="16" font-weight="bold" text-anchor="middle">USubHullComponent</text>
    <path d="M 700 330 L 950 330" stroke="#ff7675" stroke-width="1" stroke-dasharray="4"/>
    <text x="715" y="355" fill="#fff" font-size="13">● Damage Grid / Breach Clusters</text>
    <text x="715" y="375" fill="#fff" font-size="13">● External Impacts (Physics)</text>
    <text x="715" y="395" fill="#fff" font-size="13">● Flow Field VFX Vectors</text>
    <text x="715" y="415" fill="#fff" font-size="13">● NO FLOOD LOGIC</text>

    <!-- Systems / Movement / Crew -->
    <rect x="375" y="450" width="250" height="120" rx="10" fill="#2d3436" stroke="#55efc4" stroke-width="2"/>
    <text x="500" y="480" fill="#55efc4" font-size="16" font-weight="bold" text-anchor="middle">Consumers &amp; Actors</text>
    <text x="390" y="505" fill="#fff" font-size="13">● SubMovement: Reads Water Mass</text>
    <text x="390" y="525" fill="#fff" font-size="13">● Crew: Detects Immersion Level</text>
    <text x="390" y="545" fill="#fff" font-size="13">● VFX: Samples Water Surface</text>

    <!-- Connections -->
    <!-- Definition to Components -->
    <path d="M 430 220 L 250 280" stroke="#fff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <path d="M 570 220 L 750 280" stroke="#fff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <path d="M 500 220 L 500 450" stroke="#fff" stroke-width="2" marker-end="url(#arrowWhite)"/>

    <!-- Bridge: Hull -> Flood -->
    <path d="M 700 355 L 300 355" stroke="#fdcb6e" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowGold)"/>
    <text x="500" y="348" fill="#fdcb6e" font-size="14" font-weight="bold" text-anchor="middle">Damage Bridge (Breach Creation)</text>

    <!-- SubFlood to Consumers -->
    <path d="M 175 430 L 175 485 L 375 485" stroke="#74b9ff" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="275" y="475" fill="#74b9ff" font-size="12" text-anchor="middle">OnCompartmentFloodUpdated</text>

    <defs>
        <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#fff" />
        </marker>
        <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#fdcb6e" />
        </marker>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#74b9ff" />
        </marker>
    </defs>
</svg>
