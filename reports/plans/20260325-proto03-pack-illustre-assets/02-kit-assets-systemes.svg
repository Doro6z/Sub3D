    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>
<text class="title" x="60" y="62">Planche 2 - Kit d&apos;assets par systeme</text><text class="subtitle" x="60" y="98">Inventaire de production du premier sous-marin. On raisonne en familles fonctionnelles et en dependances.</text><rect class="panel" x="60" y="150" width="310" height="500" rx="20" /><rect class="navSolid" x="60" y="150" width="310" height="62" rx="20" /><text class="h2" x="78" y="190" text-anchor="start"><tspan x="78" dy="0">Commande / navigation</tspan></text><rect class="tag" x="78" y="234" width="58" height="28" rx="14" /><text class="tagText" x="98" y="252" text-anchor="middle"><tspan x="98" dy="0">P1</tspan></text><text class="text" x="152" y="252" text-anchor="start"><tspan x="152" dy="0">SM_HelmConsole_A</tspan></text><rect class="tag" x="78" y="288" width="58" height="28" rx="14" /><text class="tagText" x="98" y="306" text-anchor="middle"><tspan x="98" dy="0">P1</tspan></text><text class="text" x="152" y="306" text-anchor="start"><tspan x="152" dy="0">SM_CommandDesk_A</tspan></text><rect class="tag" x="78" y="342" width="58" height="28" rx="14" /><text class="tagText" x="98" y="360" text-anchor="middle"><tspan x="98" dy="0">P1</tspan></text><text class="text" x="152" y="360" text-anchor="start"><tspan x="152" dy="0">SM_RadarConsole_A</tspan></text><rect class="tag2" x="78" y="396" width="58" height="28" rx="14" /><text class="tagText" x="98" y="414" text-anchor="middle"><tspan x="98" dy="0">P2</tspan></text><text class="text" x="152" y="414" text-anchor="start"><tspan x="152" dy="0">SM_NavRepeater_A</tspan></text><rect class="tag2" x="78" y="450" width="58" height="28" rx="14" /><text class="tagText" x="98" y="468" text-anchor="middle"><tspan x="98" dy="0">P2</tspan></text><text class="text" x="152" y="468" text-anchor="start"><tspan x="152" dy="0">SM_ChartShelf_A</tspan></text><line class="tableLine" x1="78" y1="488" x2="352" y2="488" /><text class="small" x="78" y="538" text-anchor="start"><tspan x="78" dy="0">Role : noeud lisible, frontal, visible a 10 m.</tspan><tspan x="78" dy="24">Ne jamais noyer le helm dans des props lateraux.</tspan></text><rect class="panel" x="406" y="150" width="310" height="500" rx="20" /><rect class="ballSolid" x="406" y="150" width="310" height="62" rx="20" /><text class="h2" x="424" y="190" text-anchor="start"><tspan x="424" dy="0">Ballast / pompage</tspan></text><rect class="tag" x="424" y="234" width="58" height="28" rx="14" /><text class="tagText" x="444" y="252" text-anchor="middle"><tspan x="444" dy="0">P1</tspan></text><text class="text" x="498" y="252" text-anchor="start"><tspan x="498" dy="0">SM_BallastForeTank_A</tspan></text><rect class="tag" x="424" y="288" width="58" height="28" rx="14" /><text class="tagText" x="444" y="306" text-anchor="middle"><tspan x="444" dy="0">P1</tspan></text><text class="text" x="498" y="306" text-anchor="start"><tspan x="498" dy="0">SM_BallastRearTank_A</tspan></text><rect class="tag" x="424" y="342" width="58" height="28" rx="14" /><text class="tagText" x="444" y="360" text-anchor="middle"><tspan x="444" dy="0">P1</tspan></text><text class="text" x="498" y="360" text-anchor="start"><tspan x="498" dy="0">SM_BallastConsole_A</tspan></text><rect class="tag" x="424" y="396" width="58" height="28" rx="14" /><text class="tagText" x="444" y="414" text-anchor="middle"><tspan x="444" dy="0">P1</tspan></text><text class="text" x="498" y="414" text-anchor="start"><tspan x="498" dy="0">SM_PumpModule_A</tspan></text><rect class="tag" x="424" y="450" width="58" height="28" rx="14" /><text class="tagText" x="444" y="468" text-anchor="middle"><tspan x="444" dy="0">P1</tspan></text><text class="text" x="498" y="468" text-anchor="start"><tspan x="498" dy="0">SM_ValveManifold_A</tspan></text><line class="tableLine" x1="424" y1="488" x2="698" y2="488" /><text class="small" x="424" y="538" text-anchor="start"><tspan x="424" dy="0">Role : faire lire le flux et la masse d&apos;eau.</tspan><tspan x="424" dy="24">Les deux ballasts doivent exister comme actifs distincts.</tspan></text><rect class="panel" x="752" y="150" width="310" height="500" rx="20" /><rect class="propSolid" x="752" y="150" width="310" height="62" rx="20" /><text class="h2" x="770" y="190" text-anchor="start"><tspan x="770" dy="0">Propulsion / energie</tspan></text><rect class="tag" x="770" y="234" width="58" height="28" rx="14" /><text class="tagText" x="790" y="252" text-anchor="middle"><tspan x="790" dy="0">P1</tspan></text><text class="text" x="844" y="252" text-anchor="start"><tspan x="844" dy="0">SM_EngineBlock_A</tspan></text><rect class="tag" x="770" y="288" width="58" height="28" rx="14" /><text class="tagText" x="790" y="306" text-anchor="middle"><tspan x="790" dy="0">P1</tspan></text><text class="text" x="844" y="306" text-anchor="start"><tspan x="844" dy="0">SM_PowerCabinet_A</tspan></text><rect class="tag2" x="770" y="342" width="58" height="28" rx="14" /><text class="tagText" x="790" y="360" text-anchor="middle"><tspan x="790" dy="0">P2</tspan></text><text class="text" x="844" y="360" text-anchor="start"><tspan x="844" dy="0">SM_ShaftHousing_A</tspan></text><rect class="tag2" x="770" y="396" width="58" height="28" rx="14" /><text class="tagText" x="790" y="414" text-anchor="middle"><tspan x="790" dy="0">P2</tspan></text><text class="text" x="844" y="414" text-anchor="start"><tspan x="844" dy="0">SM_CableTray_A</tspan></text><rect class="tag2" x="770" y="450" width="58" height="28" rx="14" /><text class="tagText" x="790" y="468" text-anchor="middle"><tspan x="790" dy="0">P2</tspan></text><text class="text" x="844" y="468" text-anchor="start"><tspan x="844" dy="0">SM_BatteryRack_A</tspan></text><line class="tableLine" x1="770" y1="488" x2="1044" y2="488" /><text class="small" x="770" y="538" text-anchor="start"><tspan x="770" dy="0">Role : masse lourde, bruit, maintenance, energie.</tspan><tspan x="770" dy="24">Le moteur se lit par volume, pas par greeble.</tspan></text><rect class="panel" x="1098" y="150" width="310" height="500" rx="20" /><rect class="confSolid" x="1098" y="150" width="310" height="62" rx="20" /><text class="h2" x="1116" y="190" text-anchor="start"><tspan x="1116" dy="0">Confinement / reparation</tspan></text><rect class="tag" x="1116" y="234" width="58" height="28" rx="14" /><text class="tagText" x="1136" y="252" text-anchor="middle"><tspan x="1136" dy="0">P1</tspan></text><text class="text" x="1190" y="252" text-anchor="start"><tspan x="1190" dy="0">SM_BulkheadFrame_A</tspan></text><rect class="tag" x="1116" y="288" width="58" height="28" rx="14" /><text class="tagText" x="1136" y="306" text-anchor="middle"><tspan x="1136" dy="0">P1</tspan></text><text class="text" x="1190" y="306" text-anchor="start"><tspan x="1190" dy="0">SM_BulkheadDoor_A</tspan></text><rect class="tag" x="1116" y="342" width="58" height="28" rx="14" /><text class="tagText" x="1136" y="360" text-anchor="middle"><tspan x="1136" dy="0">P1</tspan></text><text class="text" x="1190" y="360" text-anchor="start"><tspan x="1190" dy="0">SM_RepairWallPanel_A</tspan></text><rect class="tag" x="1116" y="396" width="58" height="28" rx="14" /><text class="tagText" x="1136" y="414" text-anchor="middle"><tspan x="1136" dy="0">P1</tspan></text><text class="text" x="1190" y="414" text-anchor="start"><tspan x="1190" dy="0">SM_HatchTrunk_A</tspan></text><rect class="tag2" x="1116" y="450" width="58" height="28" rx="14" /><text class="tagText" x="1136" y="468" text-anchor="middle"><tspan x="1136" dy="0">P2</tspan></text><text class="text" x="1190" y="468" text-anchor="start"><tspan x="1190" dy="0">SM_CompartmentSign_A</tspan></text><line class="tableLine" x1="1116" y1="488" x2="1390" y2="488" /><text class="small" x="1116" y="538" text-anchor="start"><tspan x="1116" dy="0">Role : couper la propagation et reserver la reparation.</tspan><tspan x="1116" dy="24">Une porte sauve le run ou le condamne.</tspan></text><rect class="panel" x="1444" y="150" width="296" height="500" rx="20" /><rect class="senseSolid" x="1444" y="150" width="296" height="62" rx="20" /><text class="h2" x="1462" y="190" text-anchor="start"><tspan x="1462" dy="0">Combat / senseur</tspan></text><rect class="tag" x="1462" y="234" width="58" height="28" rx="14" /><text class="tagText" x="1482" y="252" text-anchor="middle"><tspan x="1482" dy="0">P1</tspan></text><text class="text" x="1536" y="252" text-anchor="start"><tspan x="1536" dy="0">SM_RadarMast_A</tspan></text><rect class="tag" x="1462" y="288" width="58" height="28" rx="14" /><text class="tagText" x="1482" y="306" text-anchor="middle"><tspan x="1482" dy="0">P1</tspan></text><text class="text" x="1536" y="306" text-anchor="start"><tspan x="1536" dy="0">SM_TurretBase_A</tspan></text><rect class="tag2" x="1462" y="342" width="58" height="28" rx="14" /><text class="tagText" x="1482" y="360" text-anchor="middle"><tspan x="1482" dy="0">P2</tspan></text><text class="text" x="1536" y="360" text-anchor="start"><tspan x="1536" dy="0">SM_TurretControl_A</tspan></text><rect class="tag2" x="1462" y="396" width="58" height="28" rx="14" /><text class="tagText" x="1482" y="414" text-anchor="middle"><tspan x="1482" dy="0">P2</tspan></text><text class="text" x="1536" y="414" text-anchor="start"><tspan x="1536" dy="0">SM_SensorCabinet_A</tspan></text><rect class="tag2" x="1462" y="450" width="58" height="28" rx="14" /><text class="tagText" x="1482" y="468" text-anchor="middle"><tspan x="1482" dy="0">P2</tspan></text><text class="text" x="1536" y="468" text-anchor="start"><tspan x="1536" dy="0">SM_AntennaCluster_A</tspan></text><line class="tableLine" x1="1462" y1="488" x2="1722" y2="488" /><text class="small" x="1462" y="538" text-anchor="start"><tspan x="1462" dy="0">Role : point haut, lecture exterieure, extension future.</tspan><tspan x="1462" dy="24">Le premier proto garde cette famille tres sobre.</tspan></text><rect class="panel" x="60" y="690" width="1680" height="520" rx="20" /><text class="h1" x="84" y="730" text-anchor="start"><tspan x="84" dy="0">Ordre reel de fabrication pour un proto jouable</tspan></text><line class="tableLine" x1="84" y1="758" x2="1716" y2="758" /><text class="h2" x="92" y="790" text-anchor="start"><tspan x="92" dy="0">Phase 0</tspan></text><text class="mono" x="240" y="790" text-anchor="start"><tspan x="240" dy="0">2 meshes</tspan></text><text class="text" x="430" y="790" text-anchor="start"><tspan x="430" dy="0">SM_HullShell_Ext_A, SM_HullShell_Int_A</tspan></text><text class="small" x="430" y="816" text-anchor="start"><tspan x="430" dy="0">Sans eux, aucune lecture spatiale n&apos;existe.</tspan></text><line class="tableLine" x1="84" y1="856" x2="1716" y2="856" /><text class="h2" x="92" y="878" text-anchor="start"><tspan x="92" dy="0">Phase 1</tspan></text><text class="mono" x="240" y="878" text-anchor="start"><tspan x="240" dy="0">3 meshes</tspan></text><text class="text" x="430" y="878" text-anchor="start"><tspan x="430" dy="0">SM_BulkheadFrame_A, SM_BulkheadDoor_A, SM_HatchTrunk_A</tspan></text><text class="small" x="430" y="904" text-anchor="start"><tspan x="430" dy="0">Le confinement et le sas doivent apparaitre avant les stations.</tspan></text><line class="tableLine" x1="84" y1="944" x2="1716" y2="944" /><text class="h2" x="92" y="966" text-anchor="start"><tspan x="92" dy="0">Phase 2</tspan></text><text class="mono" x="240" y="966" text-anchor="start"><tspan x="240" dy="0">5 meshes</tspan></text><text class="text" x="430" y="966" text-anchor="start"><tspan x="430" dy="0">SM_HelmConsole_A, SM_BallastConsole_A, SM_EngineBlock_A, SM_PumpModule_A, SM_RepairWallPanel_A</tspan></text><text class="small" x="430" y="992" text-anchor="start"><tspan x="430" dy="0">Ce sont les cinq reperes de gameplay obligatoires.</tspan></text><line class="tableLine" x1="84" y1="1032" x2="1716" y2="1032" /><text class="h2" x="92" y="1054" text-anchor="start"><tspan x="92" dy="0">Phase 3</tspan></text><text class="mono" x="240" y="1054" text-anchor="start"><tspan x="240" dy="0">8 a 10 meshes</tspan></text><text class="text" x="430" y="1054" text-anchor="start"><tspan x="430" dy="0">tuyaux, cables, echelle, rampe, luminaire, coffre, manifolds</tspan></text><text class="small" x="430" y="1080" text-anchor="start"><tspan x="430" dy="0">Seulement apres validation du graybox et du test de circulation.</tspan></text><line class="tableLine" x1="84" y1="1120" x2="1716" y2="1120" /><text class="h2" x="92" y="1142" text-anchor="start"><tspan x="92" dy="0">Phase 4</tspan></text><text class="mono" x="240" y="1142" text-anchor="start"><tspan x="240" dy="0">variantes d&apos;etat</tspan></text><text class="text" x="430" y="1142" text-anchor="start"><tspan x="430" dy="0">nominal, utilisable, endommage, critique, inonde</tspan></text><text class="small" x="430" y="1168" text-anchor="start"><tspan x="430" dy="0">Les etats arrivent en dernier, jamais avant la lisibilite de base.</tspan></text><line class="tableLine" x1="84" y1="1208" x2="1716" y2="1208" /><text class="small" x="84" y="1180" text-anchor="start"><tspan x="84" dy="0">Interdit avant validation :</tspan><tspan x="84" dy="24">petits props decoratifs, tuyaux micro-detail, mobilier gratuit, doubles variantes de consoles, clutter de sol.</tspan></text>
</svg>
